/* MB-SKINS-END */

*{box-sizing:border-box}
/* The six skins each carry their own corner radius (--mb-r, 12px on Pipeline
   through 26px on Rose). Nothing was reading it, so every skin came out the
   same shape. These three derive from it, and the cards below use them. */
:root{--mb-rl:var(--mb-r);--mb-rm:calc(var(--mb-r) * .7);--mb-rs:calc(var(--mb-r) * .5)}
body{background:var(--mb-paper);color:var(--mb-ink);font-family:var(--mb-sans);font-weight:300;
     font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:56px 24px 96px}
@media(max-width:720px){.wrap{padding:36px 18px 64px}}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mb-mute);
         font-weight:500;margin:0 0 14px}
h1{font-family:var(--mb-serif);font-weight:300;font-size:clamp(34px,5.6vw,54px);line-height:1.07;
   letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance;max-width:16ch}
h1 em{font-style:italic;color:var(--mb-gold)}
.lede{font-size:clamp(16px,2vw,18.5px);max-width:62ch;color:var(--mb-ink2);margin:0 0 14px}
.lede b{font-weight:500;color:var(--mb-ink)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:48px;align-items:start;margin-top:46px}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr);gap:32px}}
h2{font-family:var(--mb-serif);font-weight:400;font-size:26px;margin:0 0 6px;letter-spacing:-.015em}
h2:not(:first-child){margin-top:38px}
.sub{font-size:14.5px;color:var(--mb-ink2);margin:0 0 18px;max-width:56ch}
.stack{display:grid;gap:9px}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 16px;background:var(--mb-card);
     border:1px solid var(--mb-line);border-radius:16px}
.row .k{flex:none;width:9px;height:9px;border-radius:999px;background:var(--mb-gold);margin-top:8px}
.row .tx b{display:block;font-size:14.5px;font-weight:600}
.row .tx span{display:block;font-size:14px;color:var(--mb-ink2);margin-top:1px}
.q{margin-top:14px;padding:18px 20px;background:var(--mb-card);border:1px solid var(--mb-line);
   border-left:3px solid var(--mb-rose);border-radius:16px}
.q b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px}
.q p{margin:0;font-size:14.5px;color:var(--mb-ink2)}
.q + .q{margin-top:10px}
.prev{margin-bottom:12px}
.prev > span{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
   color:var(--mb-mute);font-weight:600;margin-bottom:7px}
.prev div{display:flex;gap:6px}
.prev button{flex:1;font:inherit;font-size:12px;font-weight:500;padding:7px 6px;border-radius:999px;
   border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink2);cursor:pointer;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev button[aria-pressed="true"]{background:var(--mb-ink);color:var(--mb-paper);border-color:var(--mb-ink)}

.phone{width:392px;max-width:100%;background:var(--mb-shell);border:1px solid var(--mb-line);
       border-radius:38px;padding:11px;position:sticky;top:22px}
@media(max-width:900px){.phone{position:static;margin:0 auto;width:100%}}
.screen{background:var(--mb-card);border-radius:28px;overflow:hidden;height:730px;position:relative;
        display:flex;flex-direction:column;font-family:var(--mb-app);color:var(--mb-ink)}

/* ---- header, with the Meena Bazaar mark on the right ---- */
.hd{padding:14px 15px 12px;flex:none;border-bottom:1px solid var(--mb-line2)}
.hd .r1{display:flex;align-items:flex-start;gap:12px}
.hd .who{flex:1;min-width:0}
.hd .nm{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .al{display:block;font-size:11.5px;color:var(--mb-mute);margin-top:1px;letter-spacing:.03em}
.hd .mb{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.hd .mb{align-items:flex-end}
.hd .mbrow{display:flex;align-items:center;gap:10px}
.hd .mb img{display:block;height:36px;width:auto;opacity:.94}
.gear{flex:none;border:0;background:none;color:var(--mb-mute);font-size:21px;line-height:1;
   cursor:pointer;padding:2px 0 2px 4px}
.gear:active{color:var(--mb-ink)}

.samplenote{display:flex;gap:9px;align-items:flex-start;padding:10px 13px;margin:0 0 10px;
  border-radius:12px;background:var(--mb-midsoft);border:1px solid var(--mb-mid);
  color:var(--mb-ink);font-size:12px;line-height:1.45}
.samplenote b{font-weight:700}
.samplenote .sni{flex:none;font-size:13px}
.supsearch{width:100%;font:inherit;font-size:14px;padding:11px 13px;margin:0 0 10px;
  border:1px solid var(--mb-line);border-radius:12px;background:var(--mb-card);color:var(--mb-ink)}
.posaved{padding:12px 14px;margin:0 0 10px;border-radius:12px;background:var(--mb-oksoft);
  border:1px solid var(--mb-ok);color:var(--mb-ok);font-size:12.5px;line-height:1.5}
.posaved b{font-weight:700;display:block;margin-bottom:2px}

/* The home tiles read zRetailHQ0. These two say so while it is happening, and
   say plainly when it failed - the tiles show a dash rather than a stale or
   invented number. */
.livewait{padding:9px 13px;margin:0 0 8px;border-radius:12px;
  background:var(--mb-tint);color:var(--mb-ink2);font-size:12px}
.livebad{padding:10px 13px;margin:0 0 8px;border-radius:12px;
  background:var(--mb-badsoft);color:var(--mb-bad);font-size:12px;line-height:1.45;
  border:1px solid var(--mb-bad)}
.livebad b{font-weight:700}
.livebad button{font:inherit;font-size:11.5px;font-weight:600;margin-left:6px;
  padding:4px 10px;border-radius:999px;border:1px solid var(--mb-bad);
  background:transparent;color:var(--mb-bad);cursor:pointer}

/* Sign out, in the header rather than buried in Settings: leaving a shared
   screen is something you want to do quickly. */
.signout{flex:none;display:flex;align-items:center;justify-content:center;
   width:30px;height:30px;padding:0;border:1px solid var(--mb-line);border-radius:999px;
   background:var(--mb-card);color:var(--mb-ink2);cursor:pointer;
   transition:color .12s,border-color .12s,background .12s}
.signout:hover{color:var(--mb-bad);border-color:var(--mb-bad)}
.signout:active{background:var(--mb-badsoft)}
.signout:focus-visible{outline:2px solid var(--mb-gold);outline-offset:2px}
.hd .ctrls{display:flex;align-items:center;gap:9px;margin-top:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;
   background:var(--mb-line2);margin-bottom:8px}
.setrow .si{width:30px;height:30px;border-radius:999px;background:var(--mb-card);flex:none;
   display:flex;align-items:center;justify-content:center;font-size:14px}
.setrow .st{flex:1;min-width:0}
.setrow .st b{display:block;font-size:13.5px;font-weight:600}
.setrow .st span{display:block;font-size:11.5px;color:var(--mb-ink2);margin-top:1px}
.setrow .soon{flex:none;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
   color:var(--mb-mute);background:var(--mb-card);padding:4px 8px;border-radius:999px}
.fl{font:inherit;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;
   border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink);cursor:pointer;
   display:flex;align-items:center;gap:5px;white-space:nowrap}
.fl u{text-decoration:none;color:var(--mb-mute);font-size:10px}
.ledglab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mb-mute);
   font-weight:600;margin-top:12px}
.ledg{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.ledg button{font:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:999px;
   border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-mute);cursor:pointer}
.ledg button[aria-pressed="true"]{background:var(--mb-goldsoft);color:var(--mb-gold);border-color:var(--mb-gold)}

.body{flex:1;overflow-y:auto;padding:4px 12px 18px}
.body::-webkit-scrollbar{width:0}
.colhd{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mb-gold);
   font-weight:700;margin:15px 3px 9px}
.colhd:first-child{margin-top:7px}
.tg{display:grid;gap:9px}
.t2{grid-template-columns:1fr 1fr}
.t2.top{align-items:start}
/* the ledger is a small tile - a label, the figure, a way in */
.tile.compact{padding:12px 14px 13px}
.tile.compact .ic{width:26px;height:26px;font-size:13px;margin-bottom:7px}
.tile.compact .tt{font-size:13.5px}
.tile.compact .big{font-size:22px;margin-top:6px}
.t3{grid-template-columns:1fr 1fr 1fr}
/* a third of the width, so the label carries it and the icon shrinks */
.tile.sm3{padding:12px 10px 13px;border-radius:calc(var(--mb-r) * .85)}
.tile.sm3 .ic{width:26px;height:26px;font-size:13px;margin-bottom:8px}
.tile.sm3 .tt{font-size:12.5px;line-height:1.25;letter-spacing:-.01em}
.tile.sm3 .ts{font-size:10.5px;margin-top:3px;line-height:1.35}

.tile{background:var(--mb-card);border:1px solid var(--mb-line);border-radius:var(--mb-rl);padding:13px 15px 15px;
      display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile:focus-visible{outline:2px solid var(--mb-gold);outline-offset:2px}
.tile .lab{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.11em;
   text-transform:uppercase;color:var(--mb-mute);font-weight:600}
.tile .big{display:block;font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.12;
   margin-top:5px;font-variant-numeric:tabular-nums}
.tile .big.md{font-size:23px}
.tile .un{font-size:12px;color:var(--mb-ink2);font-weight:400;letter-spacing:0}
.tile .foot{display:block;font-size:11.5px;color:var(--mb-ink2);margin-top:5px;
   font-variant-numeric:tabular-nums}
.tile .foot b{color:var(--mb-ink);font-weight:600}
.tile.val{background:var(--mb-line2);border-color:transparent;padding:11px 15px 13px}
.tile.hero{border-color:var(--mb-gold);background:linear-gradient(180deg,var(--mb-goldsoft),var(--mb-card) 55%);
   padding-bottom:13px}
.tile.sell{background:var(--mb-plumsoft);border-color:var(--mb-plum)}
.tile.sell .tt{color:var(--mb-plum)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--mb-gold);display:inline-block;flex:none}
.bar{display:block;height:5px;border-radius:999px;background:var(--mb-line2);margin-top:10px;overflow:hidden}
.tile.val .bar{background:var(--mb-card)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--mb-gold)}
.wk{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:10px}
.wk i{flex:1;background:var(--mb-fillbg);
   background:color-mix(in srgb, var(--mb-gold) 30%, var(--mb-card));
   border-radius:2px 2px 0 0;min-height:3px;display:block}
.wk i:last-child{background:var(--mb-gold)}
.wk i.part{background:repeating-linear-gradient(45deg,var(--mb-gold) 0 2px,transparent 2px 4px);
   border:1px solid var(--mb-gold);border-bottom:0}
.wklab{display:block;font-size:10px;color:var(--mb-mute);margin-top:5px}

/* ---- the two picture rails ---- */
.railwrap{margin:0 -12px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 6px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:0}
.bt{flex:none;width:126px;scroll-snap-align:start;background:var(--mb-card);border:1px solid var(--mb-line);
   border-radius:var(--mb-rm);padding:0 0 11px;overflow:hidden;font:inherit;color:inherit;text-align:left;
   cursor:pointer;display:block}
.bt:focus-visible{outline:2px solid var(--mb-gold);outline-offset:2px}
.bim{display:block;height:126px;border-radius:var(--mb-rm) var(--mb-rm) var(--mb-rs) var(--mb-rs);position:relative;overflow:hidden}
.bim img{width:100%;height:100%;object-fit:cover;display:block}
.bim.swatch::after{content:"";position:absolute;inset:0;
   background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,transparent 1px 3px),
              repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);
   mix-blend-mode:overlay}
.bim .nopic{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:9px;
   letter-spacing:.05em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.3);font-weight:600}
.bsku{display:block;margin:9px 11px 0;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{display:block;margin:2px 11px 0;font-size:10.5px;color:var(--mb-mute);white-space:nowrap;
   overflow:hidden;text-overflow:ellipsis}
.bfig{display:block;margin:5px 11px 0;font-size:11px;color:var(--mb-ink2);
   font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfig b{color:var(--mb-ink);font-weight:600}
.bfig.low b{color:var(--mb-rose)}
.bbal{display:block;margin:1px 11px 0;font-size:11px;color:var(--mb-mute);
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbal b{color:var(--mb-ink2);font-weight:600}

.act{display:block;margin-top:12px}
.act button{width:100%;font:inherit;font-size:13.5px;font-weight:600;padding:12px;border-radius:999px;
   border:0;background:var(--mb-ink);color:var(--mb-paper);cursor:pointer}
.ic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;
   background:var(--mb-line2);font-size:14px;margin-bottom:9px}
.tile.sell .ic{background:var(--mb-card);color:var(--mb-plum)}
.tile .tt{display:block;font-size:14px;font-weight:600;letter-spacing:-.005em}
.tile .ts{display:block;font-size:11.5px;color:var(--mb-ink2);margin-top:2px}
.dum{display:block;font-size:10.5px;color:var(--mb-rose);margin-top:6px;font-style:italic}

/* faces on the contact tile */
.faces{display:flex;gap:-6px;margin-top:10px;align-items:center}
.face{width:30px;height:30px;border-radius:999px;background:var(--mb-goldsoft);color:var(--mb-gold);
   border:2px solid var(--mb-card);margin-left:-8px;display:flex;align-items:center;justify-content:center;
   font-size:11px;font-weight:700;flex:none}
.face:first-child{margin-left:0}
.face.more{background:var(--mb-line2);color:var(--mb-mute)}

/* period sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--mb-card);border-top:1px solid var(--mb-line);
   border-radius:var(--mb-rl) var(--mb-rl) 0 0;padding:16px 16px 20px;transform:translateY(102%);
   transition:transform .22s cubic-bezier(.3,.8,.4,1);box-shadow:0 -8px 30px rgba(0,0,0,.14);z-index:5;
   max-height:calc(100% - 18px);overflow-y:auto;overscroll-behavior:contain;
   -webkit-overflow-scrolling:touch}
/* a grab handle, so a sheet that scrolls looks like one */
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;
   background:var(--mb-line);margin:-4px auto 12px;flex:none}
.sheet.on{transform:translateY(0)}
.sheet h4{margin:0 0 11px;font-size:14px;font-weight:600}
.sheet .op{display:grid;gap:6px}
.sheet .op button{width:100%;text-align:left;font:inherit;font-size:13.5px;padding:11px 14px;
   border-radius:14px;border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink);
   cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sheet .op button[aria-pressed="true"]{background:var(--mb-goldsoft);border-color:var(--mb-gold);
   color:var(--mb-gold);font-weight:600}
.sheet .op button u{text-decoration:none;font-size:11.5px;color:var(--mb-mute)}

/* report screen */
.back{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;
   color:var(--mb-gold);background:none;border:0;padding:2px;cursor:pointer;margin:6px 0 4px}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:4px 0 10px;margin:0 -12px;padding-left:12px}
.tabs::-webkit-scrollbar{height:0}
.tabs button{flex:none;font:inherit;font-size:11.5px;font-weight:600;padding:6px 13px;border-radius:999px;
   border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-mute);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--mb-ink);color:var(--mb-paper);border-color:var(--mb-ink)}
.rt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.rt th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mb-mute);
   font-weight:600;padding:0 0 7px}
.rt th.n,.rt td.n{text-align:right}
.rt td{padding:9px 0;border-top:1px solid var(--mb-line2)}
.rt td.k{font-weight:500}
.rt tr:last-child td{border-bottom:1px solid var(--mb-line2)}
.rt .tot td{font-weight:700;border-top:2px solid var(--mb-line);background:none}
.av.ini{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
   font-weight:600;letter-spacing:.02em}
.pcard .av.ini{font-size:14px}
.prole{display:block;font-size:9.5px;font-weight:700;color:var(--mb-gold);text-transform:uppercase;
   letter-spacing:.08em;margin-bottom:2px}
.pabout{display:block;font-size:12px;color:var(--mb-mute);line-height:1.45;margin-top:9px}
/* size */
.pmimg{display:block;width:100%;max-width:190px;aspect-ratio:3/4;margin:12px auto 0;
   border-radius:18px;overflow:hidden;background:var(--mb-soft)}
.pmimg img{width:100%;height:100%;object-fit:cover;display:block}
.tst{position:absolute;left:14px;right:14px;bottom:16px;padding:12px 15px;border-radius:14px;
   background:var(--mb-ink);color:var(--mb-paper);font-size:12.5px;font-weight:500;line-height:1.4;
   opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none;z-index:60}
.tst.on{opacity:1;transform:translateY(0)}
/* photographs the vendor sends us */
.isheet .acts button.cam{flex:0 0 46px;font-size:16px;padding:12px 0}
.csheet .acts button.cam{flex:0 0 46px;font-size:16px;padding:12px 0}
.obx{display:flex;flex-direction:column;gap:7px}
.ob{display:flex;gap:9px;padding:11px 12px;border-radius:14px;background:var(--mb-leafsoft);
   border:1px solid transparent}
.ob i{font-style:normal;color:var(--mb-leaf);font-size:13px;flex:none;line-height:1.4}
.ob span{flex:1;min-width:0;font-size:11.5px;color:var(--mb-ink2);line-height:1.45}
.ob b{display:block;font-size:12px;color:var(--mb-ink);font-weight:650;margin-bottom:2px}
.rsn{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.rsn button{font:inherit;font-size:12.5px;font-weight:500;text-align:left;padding:11px 13px;
   border-radius:13px;border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink);cursor:pointer}
.rsn button[aria-pressed="true"]{border-color:var(--mb-ink);background:var(--mb-ink);color:var(--mb-paper);
   font-weight:600}

.tile.ship .ic{background:var(--mb-tint)}
.tile.ship{border-color:var(--mb-soft)}
/* ---------------- report drill-downs ---------------- */
.rt tr.tap{cursor:pointer}
.rt tr.tap:active td{background:var(--mb-tint)}
.tgo{float:right;color:var(--mb-mute);font-weight:600;padding-left:8px}
.rt .rz{display:block;font-style:normal;font-size:11px;color:var(--mb-mute);
   font-weight:400;margin-top:2px;line-height:1.35}
.drhd{padding:2px 0 12px}
.drhd b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.drhd span{display:block;font-size:12.5px;color:var(--mb-mute);margin-top:4px;line-height:1.45}
.csw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;
   margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.csw.sm{width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.drow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
   background:var(--mb-card);border:1px solid var(--mb-line);border-radius:14px;
   padding:10px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.drow:active{background:var(--mb-tint)}
.drow>img{width:46px;height:60px;object-fit:cover;border-radius:8px;flex:none;display:block}
.dnop{width:46px;height:60px;border-radius:8px;flex:none;display:flex;align-items:center;
   justify-content:center;text-align:center;font-size:9px;line-height:1.15;color:var(--mb-mute);
   background:var(--mb-tint);border:1px dashed var(--mb-line)}
.dnop.big{width:100%;height:190px;font-size:12px}
.dtx{flex:1;min-width:0}
.dtx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.dtx u{display:block;text-decoration:none;font-size:11px;color:var(--mb-mute);margin-top:1px}
.dtx em{display:block;font-style:normal;font-size:12px;margin-top:4px;
   font-variant-numeric:tabular-nums}
.dgo{color:var(--mb-mute);font-size:17px;line-height:1;align-self:center;flex:none}
.dsz{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dsz span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 6px;
   border-radius:6px;background:var(--mb-tint);color:var(--mb-mute);font-variant-numeric:tabular-nums}
.dsz span i{font-style:normal;font-weight:700;color:var(--mb-ink)}
.dcol{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.dcol span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mb-mute)}
.dcol span i{width:8px;height:8px;border-radius:3px;display:inline-block;
   box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.dcol .more{color:var(--mb-mute);font-weight:600}
.stb2{display:block;height:3px;border-radius:2px;background:var(--mb-tint);margin-top:6px;overflow:hidden}
.stb2 b{display:block;height:100%;border-radius:2px}
.artbig{background:var(--mb-card);border:1px solid var(--mb-line);border-radius:16px;
   padding:12px;margin-bottom:4px}
.artbig>img{width:100%;max-height:260px;object-fit:cover;border-radius:11px;display:block}
.abx{margin-top:11px}
.ab4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.ab4 span{display:block;min-width:0}
.ab4 b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
   font-variant-numeric:tabular-nums;line-height:1.1}
.ab4 b.md{font-size:14px}
.ab4 i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.07em;
   text-transform:uppercase;color:var(--mb-mute);margin-top:3px}
.abn{display:block;font-size:11.5px;color:var(--mb-mute);margin-top:7px}
/* ---------------- the ledger, bill by bill ---------------- */
.bill{background:var(--mb-card);border:1px solid var(--mb-line);border-radius:13px;
   padding:10px 12px;margin-bottom:7px}
.bill.late{border-color:var(--mb-rose)}
.b1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.b1 b{font-size:14.5px;font-weight:600}
.b1 em{font-style:normal;font-size:10.5px;color:var(--mb-rose);font-weight:700;
   letter-spacing:.05em;text-transform:uppercase}
.b1 span{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.brail{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.brail span{display:block;font-size:11.5px;font-variant-numeric:tabular-nums;min-width:0}
.brail span i{display:block;font-style:normal;font-size:8.8px;font-weight:700;letter-spacing:.07em;
   text-transform:uppercase;color:var(--mb-mute);margin-bottom:2px}
.brail span.non{color:var(--mb-mute)}
.rt td.non{color:var(--mb-mute)}
.brail span.ret b{font-weight:600;color:var(--mb-rose)}
/* ---------------- the debit note photograph ---------------- */
.dnpic{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:11px;
   background:var(--mb-tint);border:1px dashed var(--mb-line);border-radius:12px;padding:10px;
   color:inherit;font:inherit;cursor:pointer}
.dnpic img{width:40px;height:52px;object-fit:cover;border-radius:7px;display:block;flex:none}
.dnpic .ic2{width:40px;height:52px;border-radius:7px;flex:none;display:flex;align-items:center;
   justify-content:center;font-size:19px;background:var(--mb-card);border:1px solid var(--mb-line)}
.dnpic span.tx{flex:1;min-width:0;font-size:12.5px;font-weight:600}
.dnpic span.tx u{display:block;text-decoration:none;font-size:11px;font-weight:400;
   color:var(--mb-mute);margin-top:2px}

/* ---------------- the report, shown on screen when printing is blocked ------- */
#prv{display:none}
#prv.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:400;
   background:var(--mb-paper)}
.prvbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;
   border-bottom:1px solid var(--mb-line);background:var(--mb-card)}
.prvbar span{flex:1;text-align:center;font-size:13.5px;font-weight:600}
.prvbar button{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;
   border:1px solid var(--mb-line);background:var(--mb-paper);color:var(--mb-ink);cursor:pointer}
.prvbar button.p{background:var(--mb-ink);border-color:var(--mb-ink);color:var(--mb-paper)}
.prvnote{flex:none;font-size:11.5px;line-height:1.5;color:var(--mb-mute);padding:9px 12px;
   background:var(--mb-tint);border-bottom:1px solid var(--mb-line)}
#prv iframe{flex:1;width:100%;border:0;background:#fff}
/* ---------------- the printed report, A4 ---------------- */
#pr{display:none}
@media print{
  @page{ size:A4; margin:13mm 11mm 14mm; }
  html,body{background:#fff!important;height:auto!important}
  .app,.wrap,.sheet,.tst{display:none!important}
  #pr{display:block;font-family:var(--mb-app);color:#1c1a17;font-size:9.2pt;line-height:1.35}
  #pr *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pr .ph{display:flex;align-items:flex-start;justify-content:space-between;
     border-bottom:1.5pt solid #1c1a17;padding-bottom:6pt;margin-bottom:10pt}
  #pr .ph h1{font-size:15pt;font-weight:600;margin:0 0 2pt;letter-spacing:-.01em}
  #pr .ph .sub{font-size:8.4pt;color:#6b625c}
  #pr .ph img{width:42mm;display:block}
  #pr .sm{display:flex;gap:0;border:0.6pt solid #d8d0ca;border-radius:3pt;overflow:hidden;
     margin-bottom:11pt}
  #pr .sm div{flex:1;padding:6pt 8pt;border-left:0.6pt solid #e6e0db}
  #pr .sm div:first-child{border-left:0}
  #pr .sm b{display:block;font-size:13pt;font-weight:600;font-variant-numeric:tabular-nums}
  #pr .sm span{display:block;font-size:7.2pt;color:#6b625c;text-transform:uppercase;
     letter-spacing:.06em;margin-top:1pt}
  #pr h2{font-size:9.6pt;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
     color:#8a4a38;margin:12pt 0 5pt;break-after:avoid}
  #pr table{width:100%;border-collapse:collapse;font-size:8.6pt}
  #pr thead{display:table-header-group}
  #pr th{text-align:left;font-size:7pt;letter-spacing:.05em;text-transform:uppercase;color:#6b625c;
     border-bottom:0.8pt solid #b8ada6;padding:0 4pt 3pt 0;font-weight:700}
  #pr th.n,#pr td.n{text-align:right;padding-right:0;padding-left:5pt;white-space:nowrap}
  #pr td{padding:4pt 4pt 4pt 0;border-bottom:0.4pt solid #ece6e1;vertical-align:top;
     font-variant-numeric:tabular-nums}
  #pr tr{break-inside:avoid}
  #pr .thumb{width:13mm;height:17mm;object-fit:cover;border-radius:1.5pt;display:block}
  #pr .noimg{width:13mm;height:17mm;border-radius:1.5pt;display:flex;align-items:center;
     justify-content:center;font-size:5.6pt;color:#fff;text-align:center;line-height:1.1;
     box-shadow:inset 0 0 0 40mm rgba(0,0,0,.30)}
  #pr .dz{display:block;font-weight:600;font-size:9pt}
  #pr .dz em.cat{font-style:normal;font-weight:500;font-size:7.4pt;color:#6b625c;margin-left:3mm;
     letter-spacing:.01em}
  #pr .dm{display:block;font-size:7.4pt;color:#6b625c;margin-top:1pt}
  #pr .cl2{display:block;font-size:7.4pt;color:#3b332e;margin-top:2pt;line-height:1.45}
  #pr .cl2 em{font-style:normal;color:#6b625c}
  #pr .cl2 em.lb{display:inline-block;min-width:11mm;margin-right:2mm;color:#8a4a38;font-weight:700;
     font-size:6.6pt;letter-spacing:.06em;text-transform:uppercase}
  #pr .cl2.sz{margin-top:1pt}
  #pr .stb{display:block;height:3pt;border-radius:2pt;background:#eae2dc;margin-top:3pt;width:26mm}
  #pr .stb i{display:block;height:100%;border-radius:2pt}
  #pr .foot{display:block;margin-top:10pt;font-size:6.8pt;color:#8a807a;
     border-top:0.4pt solid #e6e0db;padding-top:4pt;break-inside:avoid}
  #pr .brk{break-before:page}
  #pr h3{font-size:8pt;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b625c;
     margin:9pt 0 3pt;break-after:avoid}
  #pr .lead{font-size:8.4pt;color:#3b332e;margin-bottom:2pt}
  #pr .lead.sm2{color:#6b625c;font-size:7.6pt}
  #pr table.sz2{width:auto;min-width:78mm;margin-bottom:2pt}
  #pr .cat{break-inside:auto}
  #pr .note{font-size:7.4pt;color:#6b625c;line-height:1.5;margin-top:5pt}
}
/* ---------------- the range report ---------------- */
/* Series colours are NOT the app's surface palette — that is a soft, low-chroma
   set built for backgrounds and it fails colour-blind separation outright when
   used for data. These are stepped for the job and validated: the sell-through
   bands clear CVD separation at deltaE 18.6 and normal vision at 26.9. */
/* ok / mid / bad and the two fill tokens are themed now - see the block at the
   top of this stylesheet. */
.tile.quad{padding:15px 15px 13px}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.qi{display:block;min-width:0}
.qi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05;
   font-variant-numeric:tabular-nums}
.qi b.md{font-size:21px}
.qi i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.09em;
   text-transform:uppercase;color:var(--mb-gold);margin-top:3px}
.qi u{display:block;text-decoration:none;font-size:10.5px;color:var(--mb-mute);margin-top:1px}
.qw{display:flex;align-items:flex-end;gap:3px;height:26px;margin:14px 0 0}
.qw i{display:block;flex:1;background:var(--mb-fillbg);
   background:color-mix(in srgb, var(--mb-gold) 30%, var(--mb-card));border-radius:2px}
.qw i.part{background:repeating-linear-gradient(45deg,var(--mb-goldsoft),var(--mb-goldsoft) 2px,transparent 2px,transparent 4px)}

   border-radius:999px;background:rgba(255,255,255,.93);color:#1c1a17}
.padd{flex:none;width:104px;height:139px;border-radius:16px;border:1px dashed var(--mb-line);
   background:var(--mb-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:5px;cursor:pointer;font:inherit;color:var(--mb-mute);scroll-snap-align:start}

.phint{display:block;font-size:11px;color:var(--mb-mute);line-height:1.45;margin:2px 0 0}

   display:flex;align-items:center;gap:10px}

.lotnote{display:block;padding:12px 14px;border-radius:16px;background:var(--mb-soft);
   border:1px solid var(--mb-line);margin-top:11px}

.lotnote span{display:block;font-size:11.5px;color:var(--mb-mute);line-height:1.5}

   border:1px solid var(--mb-line);margin-bottom:11px}

   text-transform:uppercase;color:var(--mb-mute)}

.szrow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}

.pohead>div{flex:1;min-width:0}
.stpill{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:700;padding:3px 6px;
   border-radius:999px;background:rgba(255,255,255,.92);color:#1c1a17;letter-spacing:.02em}
.bt{position:relative}
.greet{display:block;font-size:12px;color:var(--mb-mute);letter-spacing:.01em}
.greet em{font-style:italic}
.addpic{display:flex;gap:9px;align-items:center;width:100%;margin-top:11px;padding:11px 13px;
   border-radius:14px;border:1px dashed var(--mb-line);background:var(--mb-soft);color:var(--mb-ink);
   font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.addpic span{flex:1;font-weight:500;color:var(--mb-mute);font-size:11.5px;line-height:1.4}

.rnote{font-size:11px;color:var(--mb-mute);margin-top:11px;display:block}
.railwrap{position:relative}

.csheet .acts button.p{background:var(--mb-tile);color:var(--mb-tileink);border-color:var(--mb-tile)}

/* the team strip - scrolls north to south inside the tile */
.tstrip{display:block;margin-top:10px;max-height:118px;overflow-y:auto;scroll-snap-type:y mandatory;
   -webkit-overflow-scrolling:touch;position:relative}
.tstrip::-webkit-scrollbar{width:0}
.trow{display:flex;align-items:center;gap:9px;padding:6px 2px;scroll-snap-align:start;width:100%;

.av{width:34px;height:34px;border-radius:999px;flex:none;position:relative;overflow:hidden;

.tname span{display:block;font-size:10px;color:var(--mb-mute);white-space:nowrap;overflow:hidden;

.csheet .who2 .av u{width:40px;height:30px;bottom:-13px;border-radius:20px 20px 0 0}
.csheet h4{margin:0;font-size:17px;font-weight:600}
.csheet .role{display:block;font-size:12px;color:var(--mb-mute);margin-top:1px}
.csheet .lines2{display:grid;gap:8px;margin-top:15px}

.range{margin-top:12px;display:grid;gap:9px}

.rnote2{display:block;font-size:10.5px;color:var(--mb-mute);line-height:1.45}

/* Six named themes now, from _build/skins.py, applied on <html> rather than on
   the phone - so the ground the handset sits on moves with it. Ivory survives as
   Meena; Rose is the look this app has always had. */
body.skin-dark .mb img{filter:invert(1) brightness(1.35)}   /* the wordmark is dark ink */
.screen{background:var(--mb-paper)}
.pick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pick.six button{flex:0 1 calc(33.333% - 4px)}
.skinnow{display:block;font-size:10.5px;color:var(--mb-mute);margin-top:7px}
.pick button{flex:1;font:inherit;font-size:12px;font-weight:600;padding:8px 6px;border-radius:999px;
  border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink2);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick button[aria-pressed="true"]{background:var(--mb-ink);color:var(--mb-card);border-color:var(--mb-ink)}

.t6{grid-template-columns:1fr 1fr;gap:9px}
.tile.sq6{padding:13px 13px 14px;border-radius:18px;min-height:112px;display:flex;

   border:0;cursor:pointer;padding:0;transition:background .15s}

   border-radius:18px;margin-bottom:9px}

.minebtn.on{background:var(--mb-tile);border-color:var(--mb-tile);color:var(--mb-tileink)}
.storyfoot{font-size:11.5px!important;color:var(--mb-mute)!important;font-style:italic}
.buyg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 4px}
.buyg div{padding:11px 12px;border-radius:var(--mb-rs);background:var(--mb-soft);
   border:1px solid var(--mb-line2)}
.buyg span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
   color:var(--mb-mute);font-weight:700}
.buyg b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:3px;
   font-variant-numeric:tabular-nums}
.buyg u{display:block;text-decoration:none;font-size:10.5px;color:var(--mb-mute);margin-top:1px}
.buyg u.up{color:var(--mb-ok);font-weight:600}
.buyg u.dn{color:var(--mb-bad);font-weight:600}

/* ==========================================================================
   THE BUYING DESK — the 1 Sep redesign.
   A queue, not a dashboard. Severity is its own scale, kept apart from the
   skin's accent: act / wait / risk / dead. Everything is token-driven so all
   six skins carry it, light and dark.
   ========================================================================== */
:root{
  --sev-act:  var(--mb-ok);
  --sev-wait: var(--mb-mid);
  --sev-risk: var(--mb-bad);
  --sev-dead: var(--mb-mute);
  --sev-actbg:  var(--mb-oksoft);
  --sev-waitbg: var(--mb-midsoft);
  --sev-riskbg: var(--mb-badsoft);
}
.body{padding-bottom:74px}                    /* room for the tab bar */

/* the search line, always in reach */
.sbar{margin-top:10px}
.sbar input{width:100%;font:inherit;font-size:13px;padding:10px 13px;border-radius:999px;
  border:1px solid var(--mb-line);background:var(--mb-card);color:var(--mb-ink)}
.sbar input::placeholder{color:var(--mb-mute)}
.sres{padding-top:4px}
.sres h5{margin:14px 0 6px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mb-mute);font-weight:700}
.srow{display:block;width:100%;text-align:left;font:inherit;padding:11px 13px;margin-bottom:6px;
  border-radius:var(--mb-rm);border:1px solid var(--mb-line);background:var(--mb-card);
  color:var(--mb-ink);cursor:pointer}
.srow b{display:block;font-size:13.5px;font-weight:600}
.srow span{display:block;font-size:11.5px;color:var(--mb-mute);margin-top:1px}

/* the day strip */
.daybar{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:var(--mb-rm);
  background:var(--mb-tile);color:var(--mb-tileink);margin-bottom:16px}
.dayd b{display:block;font-family:var(--mb-serif);font-size:19px;font-weight:400;line-height:1.1}
.dayd u{display:block;text-decoration:none;font-size:10.5px;opacity:.66;margin-top:1px}
.dayk{flex:1;display:flex;gap:13px;justify-content:flex-end}
.dayk span{text-align:right;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  opacity:.66;line-height:1.25}
.dayk b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;opacity:1;
  font-variant-numeric:tabular-nums}
.dayk .hot b{color:var(--mb-goldsoft)}
.dayk .warn b{color:var(--mb-rosesoft)}

/* a section of the queue */
.qsec{margin-bottom:22px}
.qsec h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;font-size:13px;font-weight:600;
  letter-spacing:-.005em}
.qsec h3 em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--mb-mute);
  font-variant-numeric:tabular-nums}
.qdot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--sev-dead)}
.qsec.sign  .qdot{background:var(--sev-risk)}
.qsec.answer .qdot{background:var(--sev-wait)}
.qsec.repeat .qdot{background:var(--sev-act)}
.qsec.chase .qdot{background:var(--sev-risk)}
.qsec.stop  .qdot{background:var(--sev-dead)}
.qnote{margin:0 0 9px 15px;font-size:11.5px;color:var(--mb-mute)}
.qempty{margin:6px 0 0 15px;font-size:12.5px;color:var(--mb-mute);font-style:italic}

/* one decision */
.qc{border:1px solid var(--mb-line);border-left:3px solid var(--mb-line);
  border-radius:var(--mb-rs);padding:12px 13px;margin-top:8px;background:var(--mb-card)}
.qsec.sign  .qc{border-left-color:var(--sev-risk)}
.qsec.answer .qc{border-left-color:var(--sev-wait)}
.qsec.repeat .qc{border-left-color:var(--sev-act)}
.qsec.chase .qc{border-left-color:var(--sev-risk)}
.qsec.stop  .qc{border-left-color:var(--sev-dead)}
.qc h4{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.qc p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--mb-ink2)}
.qc p b{color:var(--mb-ink);font-weight:600}
.qcf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px 10px;margin-top:11px}
.qcf span{flex:1 1 130px;min-width:0;font-size:10.5px;color:var(--mb-mute);line-height:1.35;
  overflow-wrap:anywhere;padding-right:2px}
.qcf button{flex:0 0 auto;max-width:100%;font:inherit;font-size:12px;font-weight:600;padding:8px 15px;
  border-radius:999px;border:1px solid var(--mb-tile);background:var(--mb-tile);
  color:var(--mb-tileink);cursor:pointer}
.qmore{width:100%;margin-top:8px;font:inherit;font-size:12px;font-weight:600;padding:10px;
  border-radius:var(--mb-rs);border:1px dashed var(--mb-line);background:transparent;
  color:var(--mb-gold);cursor:pointer}
.qfoot{margin:6px 0 0;font-size:11.5px;line-height:1.6;color:var(--mb-mute)}

/* the other two tabs */
.tabhd{margin-bottom:14px}
.tabhd h2{margin:0;font-family:var(--mb-serif);font-size:25px;font-weight:400;letter-spacing:-.015em}
.tabhd p{margin:3px 0 0;font-size:12.5px;color:var(--mb-mute);line-height:1.5;max-width:44ch}
.hero{display:flex;align-items:center;gap:13px;width:100%;text-align:left;font:inherit;
  padding:17px 15px;border-radius:var(--mb-rl);border:1px solid var(--mb-tile);
  background:var(--mb-tile);color:var(--mb-tileink);cursor:pointer;margin-bottom:16px}
.heroic{font-size:23px;flex:none}
.herot{flex:1;min-width:0}
.herot b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.herot span{display:block;font-size:12px;opacity:.72;margin-top:3px;line-height:1.45}
.heroar{flex:none;font-size:19px;opacity:.6}
.rowlist{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;
  padding:13px 14px;border-radius:var(--mb-rm);border:1px solid var(--mb-line);
  background:var(--mb-card);color:var(--mb-ink);cursor:pointer}
.rowt{flex:1;min-width:0}
.rowt b{display:block;font-size:13.5px;font-weight:600}
.rowt span{display:block;font-size:11.5px;color:var(--mb-mute);margin-top:2px}
.rowb{flex:none;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--mb-tint);color:var(--mb-ink2)}
.rowb.risk{background:var(--sev-riskbg);color:var(--sev-risk)}
.rowb.wait{background:var(--sev-waitbg);color:var(--sev-wait)}
.rowar{flex:none;font-size:16px;color:var(--mb-mute)}

/* the book */
.bookhd{display:flex;gap:9px;margin-bottom:14px}
.bookhd div{flex:1;padding:13px 14px;border-radius:var(--mb-rm);background:var(--mb-soft);
  border:1px solid var(--mb-line2)}
.bookhd span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mb-mute);font-weight:700}
.bookhd b{display:block;font-size:26px;font-weight:600;letter-spacing:-.025em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.bookhd u{display:block;text-decoration:none;font-size:10.5px;color:var(--mb-mute);margin-top:1px}
.catg{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cat{display:block;width:100%;text-align:left;font:inherit;padding:13px 14px;
  border-radius:var(--mb-rm);border:1px solid var(--mb-line);background:var(--mb-card);
  color:var(--mb-ink);cursor:pointer}
.catn{display:block;font-size:13.5px;font-weight:600}
.catq{display:block;font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.catm{display:block;font-size:11.5px;color:var(--mb-mute);margin-top:1px}
.catbar{display:block;height:5px;border-radius:3px;background:var(--mb-tint);margin-top:9px;
  overflow:hidden}
.catbar i{display:block;height:100%;border-radius:3px;background:var(--mb-gold)}
.catsh{display:block;font-size:10.5px;color:var(--mb-mute);margin-top:4px}

/* the tab bar — thumb reach, not a menu at the top */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;
  background:var(--mb-card);border-top:1px solid var(--mb-line);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;font:inherit;font-size:10.5px;font-weight:600;padding:6px 4px;
  border:0;background:transparent;color:var(--mb-mute);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:var(--mb-rs)}
.tabbar button i{font-style:normal;font-size:16px;line-height:1}
.tabbar button[aria-pressed="true"]{color:var(--mb-gold)}
.tabbar button:focus-visible{outline:2px solid var(--mb-gold);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* pictures lead the card */
.qcrow{display:flex;gap:11px;align-items:flex-start}
.qcpic{flex:none;width:62px;height:80px;border-radius:var(--mb-rs);overflow:hidden;
  background:var(--mb-tint);display:block;position:relative}
.qcpic img{width:100%;height:100%;object-fit:cover;display:block}
.qcpic.sw,.qcpic.np{display:flex;align-items:flex-end;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.qcpic.np{align-items:center;color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em}
.qcpic u{display:block;width:100%;text-align:center;text-decoration:none;font-size:8px;
  letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.34);
  padding:2px 0;font-weight:600}
.qcb{flex:1;min-width:0}
.qsec.find .qdot{background:var(--mb-plum)}
.qc.find{border-left-color:var(--mb-plum)}
.qc.find.act{border-left-color:var(--sev-act)}
.qc.find.risk{border-left-color:var(--sev-risk)}
.qc.find.dead{border-left-color:var(--sev-dead)}

/* ---------------------------------------------------- the book on one picture
   Status colours only — four states, each carrying a written label in the
   legend, so identity never rests on colour alone. */
.qchart{margin:0 0 16px;padding:13px 12px 11px;border:1px solid var(--mb-line);
  border-radius:var(--mb-rm);background:var(--mb-card)}
.qchart figcaption{font-size:12px;font-weight:600;color:var(--mb-ink);margin-bottom:9px;
  text-wrap:balance}
.qchart svg{width:100%;height:auto;display:block;overflow:visible}
.qchart .gl{stroke:var(--mb-line2);stroke-width:1}
.qchart .ax{stroke:var(--mb-line);stroke-width:1}
.qchart .tk{fill:var(--mb-mute);font-size:8.5px;font-family:var(--mb-sans)}
.qchart .axl{fill:var(--mb-mute);font-size:8.5px;letter-spacing:.05em;
  text-transform:uppercase;font-family:var(--mb-sans);font-weight:600}
.qchart .qlab{fill:var(--mb-ok);font-size:9px;font-weight:700;letter-spacing:.04em;
  font-family:var(--mb-sans);paint-order:stroke;stroke:var(--mb-card);stroke-width:3px;
  stroke-linejoin:round}
.qchart .qlab.dim{fill:var(--mb-mute)}
.qchart .qz{opacity:.5}
.qchart .qz.reorder{fill:var(--mb-oksoft)}
.qchart .qz.stuck{fill:var(--mb-badsoft)}
.qchart .dot{stroke:var(--mb-card);stroke-width:1.4}
.qchart .dot.reorder{fill:var(--mb-ok)}
.qchart .dot.healthy{fill:var(--mb-leaf)}
.qchart .dot.quiet{fill:var(--mb-mute);opacity:.55}
.qchart .dot.stuck{fill:var(--mb-bad)}
.qleg{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px}
.qleg span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mb-ink2)}
.qleg b{font-weight:700;color:var(--mb-ink);font-variant-numeric:tabular-nums}
.qleg i{width:9px;height:9px;border-radius:99px;display:block;flex:none}
.qleg .reorder i{background:var(--mb-ok)}
.qleg .healthy i{background:var(--mb-leaf)}
.qleg .quiet i{background:var(--mb-mute);opacity:.55}
.qleg .stuck i{background:var(--mb-bad)}
.qcap{margin:9px 0 0;font-size:10.5px;line-height:1.55;color:var(--mb-mute)}

.statbar{display:flex;gap:8px;margin:2px 0 10px}
.statbar div{flex:1;padding:11px 12px;border-radius:var(--mb-rs);background:var(--mb-soft);
  border:1px solid var(--mb-line2)}
.statbar span{display:block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mb-mute);font-weight:700}
.statbar b{display:block;font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:2px;
  font-variant-numeric:tabular-nums}
.statbar b.dn{color:var(--mb-bad)} .statbar b.up{color:var(--mb-ok)}
.statbar u{display:block;text-decoration:none;font-size:9.5px;color:var(--mb-mute);
  margin-top:2px;line-height:1.35}

/* the plan */
.diary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:var(--mb-rm);
  border:1px solid var(--mb-line);border-left:3px solid var(--mb-line);background:var(--mb-card);
  position:relative}
.drow.trip{border-left-color:var(--mb-gold)}
.drow.event{border-left-color:var(--mb-bad)}
.drow.team{border-left-color:var(--mb-plum)}
.drow.store{border-left-color:var(--mb-leaf)}
.drow.sample{border-left-color:var(--mb-mid)}
.drow.vendor{border-left-color:var(--mb-ink2)}
.dwhen{flex:none;width:52px}
.dwhen b{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em}
.dwhen u{display:block;text-decoration:none;font-size:10px;color:var(--mb-mute);margin-top:1px}
.dwhat{flex:1;min-width:0}
.dwhat b{display:block;font-size:13px;font-weight:600;text-wrap:balance}
.dk{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mb-mute);margin-top:3px}
.dk i{font-style:normal}
.dn{display:block;font-size:11.5px;color:var(--mb-ink2);margin-top:4px;line-height:1.45}
.daway{flex:none;font-size:10px;color:var(--mb-mute);font-weight:600}
.dbtn{position:absolute;right:12px;bottom:11px;font:inherit;font-size:11px;font-weight:600;
  padding:5px 12px;border-radius:999px;border:1px solid var(--mb-gold);background:transparent;
  color:var(--mb-gold);cursor:pointer}
.tripsum{display:flex;gap:8px;margin:2px 0 8px}
.tripsum div{flex:1;text-align:center;padding:10px 6px;border-radius:var(--mb-rs);
  background:var(--mb-soft);border:1px solid var(--mb-line2)}
.tripsum b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.tripsum span{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mb-mute);font-weight:600;margin-top:2px;line-height:1.25}
.tabbar button{font-size:9.5px}

/* ---- the first page: plain numbers, added 2 Sep 2026 ---- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--mb-line);
  border:1px solid var(--mb-line);border-radius:var(--mb-rm,14px);overflow:hidden;margin:12px 0 6px}
.kpi{background:var(--mb-card);padding:11px 10px 10px;min-height:74px;display:flex;
  flex-direction:column;justify-content:flex-start}
.kpi span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mb-mute);font-weight:700}
.kpi b{display:block;font-family:var(--mb-serif);font-size:24px;font-weight:400;
  line-height:1.15;margin:3px 0 1px;letter-spacing:-.02em;color:var(--mb-ink)}
.kpi u{display:block;text-decoration:none;font-size:10px;color:var(--mb-mute);line-height:1.3}
.kpi.hot b{color:var(--mb-bad)}
.kpi.warn b{color:var(--mb-mid)}
@media (max-width:340px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>

    // "fifteen ninety five" -> 1595 : tens+unit after a 10..99 head
    if(a>=10 && a<=99 && b!==null && b>=20 && b<100 && b%10===0 && c!==null && c<10){
      out.push(String(a*100+b+c)); i+=3; continue;
    }
    // "eight fifty" -> 850 ; "fifteen ninety" -> 1590
    if(b!==null && b>=20 && b<100 && b%10===0 && a>=1 && a<=99){
      // but "twenty thirty" is two separate figures, not 2030 - only join when
      // the head is a plausible rupee head and no size word sits between
      out.push(String(a*100+b)); i+=2; continue;
    }
    // "twenty five" -> 25
    if(a>=20 && a<100 && a%10===0 && b!==null && b<10){ out.push(String(a+b)); i+=2; continue; }
    out.push(String(a)); i++;
  }
  return out.join(' ');
}

function normalise(raw){
  var t=' '+String(raw||'').toLowerCase()
    .replace(/[₹]/g,' rupees ')
    .replace(/[,.;:!?]/g,' ')
    .replace(/\s+/g,' ')+' ';
  t=t.replace(/\bdouble\s+excel\b/g,'2xl').replace(/\bdouble\s+xl\b/g,'2xl')
     .replace(/\btriple\s+xl\b/g,'3xl').replace(/\bexcel\b/g,'xl')
     .replace(/\bex\s*l\b/g,'xl').replace(/\bex\s*small\b/g,'xs')
     .replace(/\btwo\s*x\s*l\b/g,'2xl').replace(/\bthree\s*x\s*l\b/g,'3xl')
     .replace(/\bfour\s*x\s*l\b/g,'4xl').replace(/\bfive\s*x\s*l\b/g,'5xl')
     .replace(/\bx\s*x\s*l\b/g,'2xl').replace(/\bx\s*x\s*x\s*l\b/g,'3xl');
  t=wordsToNumbers(t);
  return ' '+t.replace(/\s+/g,' ').trim()+' ';
}

function parseOrderSpeech(raw, vocab){
  vocab=vocab||{};
  var cats=vocab.cats||[], cols=vocab.cols||[];
  var t=normalise(raw);
  var out={sizes:{}, colours:[], raw:raw, heard:t.trim()};

  // Everything is read off ONE string, and each thing that is understood is
  // blanked out of it before the next thing looks. Marking numbers as "used" by
  // their value was the bug: "in 20 days" then swallowed the 20 in "M 20", and
  // the size quietly vanished. A figure is consumed where it stands, not
  // everywhere it appears.
  function eat(re, keep){
    var m=re.exec(t); if(!m) return null;
    t = t.slice(0, m.index) + ' '.repeat(m[0].length) + t.slice(m.index+m[0].length);
    return m;
  }

  // 1. sizes first - they are the most structured thing in the sentence, and
  //    the reading that accounts for more of it wins.
  var szkeys=Object.keys(SIZEWORD).sort(function(a,b){return b.length-a.length;});
  var pat=szkeys.map(function(k){return k.replace(/ /g,'\\s+');}).join('|');
  function readSizes(sizeFirst){
    var re=sizeFirst
      ? new RegExp('\\b('+pat+')\\s+(\\d{1,4})\\b','g')
      : new RegExp('\\b(\\d{1,4})\\s+('+pat+')\\b','g');
    var got={}, spans=[], r;
    while((r=re.exec(t))){
      var key=(sizeFirst?r[1]:r[2]).replace(/\s+/g,' ');
      var sz=SIZEWORD[key]; if(!sz) continue;
      got[sz]=(got[sz]||0)+ +(sizeFirst?r[2]:r[1]);
      spans.push([r.index, r[0].length]);
    }
    return {sizes:got, n:Object.keys(got).length, spans:spans};
  }
  var A=readSizes(true), B=readSizes(false);
  var win = (B.n>A.n) ? B : A;
  out.sizes=win.sizes;
  win.spans.forEach(function(sp){
    t = t.slice(0,sp[0]) + ' '.repeat(sp[1]) + t.slice(sp[0]+sp[1]);
  });

  // 2. the design number, before any bare figure can be mistaken for it.
  //    Spoken numbers come digit by digit - "three six eight four" is 3684.
  var a=eat(/\b(?:design|article|number|no|style)\s+((?:\d\s+){2,7}\d|[a-z0-9\-]{2,14})\b/);
  if(a && /\d/.test(a[1])) out.design=a[1].replace(/\s+/g,'').toUpperCase();

  // 3. rate, only where a money cue says so
  var m=eat(/\b(?:rate|price|at|for|rupees|rs)\s+(\d{2,6})\b/) || eat(/\b(\d{3,6})\s+(?:rupees|rs)\b/);
  if(m) out.rate=+m[1];

  // 4. when they can send it
  var d=eat(/\bin\s+(\d{1,3})\s+days?\b/) || eat(/\b(\d{1,3})\s+days?\b/);
  if(d) out.days=+d[1];

  // 5. a plain total, where no size break was given
  var p=eat(/\b(\d{1,5})\s+(?:pieces?|pcs|piece)\b/);
  if(p) out.pieces=+p[1];

  // 6. category and colours, longest name first, and each match is blanked out
  //    so a shorter name sitting inside a longer one cannot match as well -
  //    "sea green" was coming back as Sea Green AND Green.
  function flat(x){ return ' '+String(x).toLowerCase().replace(/[,.]/g,' ').replace(/\s+/g,' ').trim()+' '; }
  var hay=flat(t);
  var cl=cats.slice().sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<cl.length;i++){
    var c=flat(cl[i]).trim(), forms=[c];
    if(c.slice(-1)==='s') forms.push(c.slice(0,-1)); else forms.push(c+'s');
    var hit=null;
    for(var f=0;f<forms.length && !hit;f++){
      var at=hay.indexOf(' '+forms[f]+' ');
      if(at>=0) hit={at:at+1, len:forms[f].length};
    }
    if(hit){ out.cat=cl[i];
      // blank exactly what matched - blanking the vocabulary's length instead
      // ate into the next word and turned "peach pink" into "pink"
      hay=hay.slice(0,hit.at)+' '.repeat(hit.len)+hay.slice(hit.at+hit.len);
      break; }
  }
  cols.slice().sort(function(a,b){return b.length-a.length;}).forEach(function(c){
    var k=flat(c).trim();
    var at=hay.indexOf(' '+k+' ');
    if(at<0) return;
    if(out.colours.indexOf(c)<0) out.colours.push(c);
    hay=hay.slice(0,at+1)+' '.repeat(k.length)+hay.slice(at+1+k.length);
  });

  // 7. a leftover figure is the design number if we have not found one
  if(!out.design){
    var nums=t.match(/\b\d{3,7}\b/g)||[];
    if(nums.length) out.design=nums[0];
  }

  out.total = Object.keys(out.sizes).reduce(function(x,k){return x+out.sizes[k];},0) || out.pieces || 0;
  return out;
}

function poSizes(alias){
  const mix=(V2[alias]&&V2[alias].sizeMix)||[];
  if(mix.length) return SIZE_ORDER.filter(k=>mix.some(m=>m[0]===k));
  return ['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
}
function newPONumber(alias){
  const tag=(alias||'XXX').split('-')[1]||'GEN';
  const used=((V2[alias]&&V2[alias].po)||[]).map(x=>+String(x.po).split('-').pop()).filter(x=>x);
  const next=(used.length?Math.max.apply(null,used):1200)+1;
  return 'PO-'+tag+'-'+next;
}
function startPO(alias){
  /* Dates come from the real calendar: TODAY_ISO belongs to the sample data
     and an order dated in the past would go to the supplier that way. The
     order number is assigned by the server on save, so the one shown here is
     only a placeholder. */
  const today = liveToday();
  const info = supInfo(alias);
  poDraft={supplier:alias, no:'(assigned on send)', date:today,
           due:addDays(today,21), terms:info.creditDays,
           lines:[], note:''};
  capture=null; poSave={status:'idle', order:null, error:null, sheet:null};
}
let poSave={status:'idle', order:null, error:null, sheet:null};
function addDays(iso,n){
  const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function lineQty(L){
  if(L.free) return L.qty||0;
  return Object.keys(L.sizes||{}).reduce((a,k)=>a+(L.sizes[k]||0),0);
}
function lineTotal(L){ return lineQty(L)*(L.colours&&L.colours.length?L.colours.length:1); }
function poQty(){ return (poDraft?poDraft.lines:[]).reduce((a,L)=>a+lineTotal(L),0); }
function poVal(){ return (poDraft?poDraft.lines:[]).reduce((a,L)=>a+lineTotal(L)*(L.rate||0),0); }

/* ------------------------------------------------------------------ the ear */
let rec=null, listening=false, heardText='';
function speechAvailable(){
  return !!(window.SpeechRecognition||window.webkitSpeechRecognition);
}
window.toggleMic=function(){
  if(listening){ try{ rec.stop(); }catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alertBar('This browser will not take dictation. Type it in below instead.'); return; }
  rec=new SR();
  rec.lang = {en:'en-IN',hi:'hi-IN',gu:'gu-IN'}[lang]||'en-IN';
  rec.continuous=true; rec.interimResults=true;
  let finalTxt=heardText?heardText+' ':'';
  rec.onresult=function(ev){
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal) finalTxt += r[0].transcript+' '; else interim += r[0].transcript;
    }
    heardText=(finalTxt+interim).trim();
    liveHeard();
  };
  rec.onend=function(){ listening=false; paint(); if(heardText) readIt(); };
  rec.onerror=function(){ listening=false; paint(); };
  try{ rec.start(); listening=true; paint(); }catch(e){ listening=false; }
};
function liveHeard(){
  if(!listening) return;                 // idle, the placeholder stands
  const el=document.getElementById('heard');
  if(el) el.textContent=heardText||'Listening…';
}
window.readIt=function(){
  const box=document.getElementById('sayit');
  const txt=(box&&box.value.trim()) || heardText;
  if(!txt){ alertBar('Say it, or type it in.'); return; }
  heardText=txt;
  const p=parseOrderSpeech(txt,{cats:SPEECH_CATS, cols:SPEECH_COLS});
  const alias=poDraft.supplier;
  capture=capture||{pics:[]};
  capture.design = p.design || capture.design || '';
  capture.cat    = matchCat(p.cat) || capture.cat || '';
  capture.colours= p.colours.length ? p.colours.map(T) : (capture.colours||[]);
  capture.rate   = p.rate || capture.rate || 0;
  capture.days   = p.days || capture.days || 21;
  capture.free   = !Object.keys(p.sizes).length && !!p.pieces;
  capture.qty    = p.pieces || capture.qty || 0;
  capture.sizes  = Object.keys(p.sizes).length ? p.sizes : (capture.sizes||{});
  capture.heard  = p.heard;
  capture.got    = p;
  paint();
};
function matchCat(c){
  if(!c) return '';
  const l=c.toLowerCase();
  let hit=CAT_LIST.find(x=>x.toLowerCase()===l);
  if(hit) return hit;
  hit=CAT_LIST.find(x=>x.toLowerCase().indexOf(l)>=0 || l.indexOf(x.toLowerCase())>=0);
  return hit||'';
}
window.clearHeard=function(){ heardText=''; capture=Object.assign({},capture,{heard:'',got:null}); paint(); };

  inp.onchange=function(){
    const f=inp.files&&inp.files[0]; if(!f) return;

window.sendPO=async function(){
  if(!poDraft || !poDraft.lines.length) return;
  if(poSave.status==='saving') return;

  /* One row per size, which is the grain the sheet and the order lines table
     both want. A line with no size breakdown sends its whole quantity once. */
  const lines=[];
  poDraft.lines.forEach(function(L){
    const colours = (L.colours&&L.colours.length)?L.colours:[null];
    const sizes = Object.keys(L.sizes||{}).filter(k=>L.sizes[k]>0);
    colours.forEach(function(c){
      if(sizes.length){
        sizes.forEach(function(k){
          lines.push({articleNo:L.design, colour:c, sizeName:k, qty:L.sizes[k], rate:L.rate});
        });
      } else {
        lines.push({articleNo:L.design, colour:c, sizeName:null, qty:L.qty||0, rate:L.rate});
      }
    });
  });

  poSave={status:'saving', order:null, error:null, sheet:null}; paint();

  try{
    const res = await fetch('/api/orders/create',{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        supplierAlias: poDraft.supplier,
        orderDate: poDraft.date,
        wantedBy: poDraft.due,
        termsDays: poDraft.terms,
        note: poDraft.note||'',
        lines: lines
      })
    });
    if(res.status===401){ location.href='/login?next=%2Fportal'; return; }
    const data = await res.json().catch(()=>({}));
    if(res.status!==201 || !data.ok){
      poSave={status:'error', order:null, sheet:null,
              error:(data.problems&&data.problems.join('; '))||data.detail||data.message||('HTTP '+res.status)};
      paint(); return;
    }
    poSave={status:'saved', order:data.order, sheet:data.sheet, error:null};
    lastPO=JSON.parse(JSON.stringify(poDraft));
    lastPO.no=data.order.orderNo;
    poDraft=null;
    view='posaved';
    paint();
  }catch(e){
    poSave={status:'error', order:null, sheet:null, error:'No response from the server.'};
    paint();
  }
};

  {k:'ACC', lab:'Accessories', deps:['JW','SHW','BG','GF']}

function groupOf(d){ return GROUP_OF[d] || 'ACC'; }
function groupSplit(){
  const out={}; GROUPS.forEach(g=>out[g.k]={q:0,vendors:0,bal:0,live:false});
  BOOK.forEach(function(x){
    const k=groupOf(x.d), q=bookSold(x);
    out[k].vendors++; out[k].bal+=x.b; out[k].live=true;
    if(q!=null) out[k].q+=q;
  });
  return out;

/* ------------------------------------------------------------- the queue */
function repeatList(){
  /* A colour that has gone out completely is a reorder moment that expired
     quietly. Ranked on how many went, because that is how much was left on
     the table. Design-level where this build holds the detail. */
  const fine=[];
  DETAIL.forEach(function(k){
    (ART[k]||[]).forEach(function(r){
      if(r.b>0 || r.s<40) return;                 // still stocked, or too small to matter
      fine.push({kind:'design', alias:k, a:r.a, sold:r.s, rate:r.r,
                 value:r.s*r.r, cat:subName(r.sc,r.d), colour:(r.c[0]||[''])[0]});
    });
  });
  fine.sort((a,b)=>b.value-a.value);
  const coarse=BOOK.filter(x=>x.so>=20 && !hasDetail(x.a))
    .sort((a,b)=>b.so-a.so)
    .map(x=>({kind:'supplier', alias:x.a, v:x.v, gone:x.so, st:x.st, sold:x.s}));
  return {fine:fine.slice(0,6), coarse:coarse.slice(0,6),
          total:BOOK.reduce((a,x)=>a+x.so,0)};
}
function stopList(){
  const fine=[];
  DETAIL.forEach(function(k){
    (ART[k]||[]).forEach(function(r){
      if(r.s>0 || r.b<30) return;                 // it has sold, or too small to matter
      fine.push({kind:'design', alias:k, a:r.a, bal:r.b, rate:r.r,
                 value:r.b*r.r, cat:subName(r.sc,r.d), colour:(r.c[0]||[''])[0]});
    });
  });
  fine.sort((a,b)=>b.value-a.value);
  const coarse=BOOK.filter(x=>x.nm>=15 && !hasDetail(x.a))
    .sort((a,b)=>b.nm-a.nm)
    .map(x=>({kind:'supplier', alias:x.a, v:x.v, dead:x.nm, bal:x.b, st:x.st}));
  return {fine:fine.slice(0,5), coarse:coarse.slice(0,5),
          total:BOOK.reduce((a,x)=>a+x.nm,0)};
}
function chaseList(){
  const out=[];
  DETAIL.forEach(function(k){
    ((PO[k]||{}).rows||[]).forEach(function(r){
      const st=poState(k,r.po);
      const left=Math.max(0,r.pending-((st.disp&&st.disp.qty)||0));
      if(!left || r.due>=TODAY_ISO) return;
      out.push({alias:k, po:r.po, short:r.short, colour:r.colour, left:left, due:r.due,
                value:Math.round(left*(r.value/(r.pending||1))),
                days:Math.round((new Date(TODAY_ISO+'T00:00:00Z')-new Date(r.due+'T00:00:00Z'))/86400000)});
    });
  });
  return out.sort((a,b)=>b.value-a.value);
}

function queueCounts(){
  const rep=repeatList(), stop=stopList(), chase=chaseList();
  return {
    sign: APPROVALS.filter(a=>a.state==='waiting').length,
    answer: INBOX.filter(x=>x.state==='open').length,
    repeat: rep.fine.length+rep.coarse.length,
    chase: chase.length,
    stop: stop.fine.length+stop.coarse.length,
    goneAll: rep.total, deadAll: stop.total,
    chaseValue: chase.reduce((a,x)=>a+x.value,0)
  };
}

/* ------------------------------------------------------------ live figures
   The screens below were built on the constants at the top of this file. The
   home tiles now come from zRetailHQ0 instead, through /api/reports/home.

   Two rules here, both deliberate. The date range is computed from the real
   current date, not TODAY_ISO - that constant belongs to the sample data and
   using it would query the wrong days. And a failed fetch never falls back to
   the sample numbers: it says so. A wrong figure that looks right is worse
   than a missing one on a screen someone buys stock from.
*/
const MBLIVE = {
  status: 'idle',        // idle | loading | ok | error
  home: null,
  error: null,
  range: null,
  at: null,
};

function liveToday(){
  const d = new Date();
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()))
    .toISOString().slice(0,10);
}

/* The date window for the chosen period, against the real calendar. */
function liveRange(){
  const today = liveToday();
  const t = Date.parse(today + 'T00:00:00Z');
  const iso = ms => new Date(ms).toISOString().slice(0,10);
  const back = n => iso(t - n*86400000);
  const y = +today.slice(0,4), m = +today.slice(5,7);

  switch(per){
    case 'yday':  return {from:back(1), to:back(1)};
    case 'week': {
      const d = new Date(t), dow = (d.getUTCDay()+6)%7;   // Monday = 0
      d.setUTCDate(d.getUTCDate()-dow);
      return {from:d.toISOString().slice(0,10), to:today};
    }
    case 'd7':    return {from:back(6),  to:today};
    case 'd30':   return {from:back(29), to:today};
    case 'month': return {from:today.slice(0,7)+'-01', to:today};
    case 'last': {
      const st = new Date(Date.UTC(y, m-2, 1)), en = new Date(Date.UTC(y, m-1, 0));
      return {from:st.toISOString().slice(0,10), to:en.toISOString().slice(0,10)};
    }
    case 'fy':    return {from:(m>=4?y:y-1)+'-04-01', to:today};
    case 'range': return {from:from, to:to};
    default:      return {from:back(29), to:today};
  }
}

function liveRangeLabel(){
  const R = liveRange();
  return R.from===R.to ? pretty(R.from) : pretty(R.from)+' – '+pretty(R.to);
}

/* The book and the category split, from the same views as the tiles. Loaded
   on demand rather than up front: they are two more scans of a live retail
   database and most visits never open these screens. */
const MBBOOK = { status:'idle', suppliers:null, categories:null, error:null, key:null };

async function loadBook(force){
  const R = liveRange();
  const key = R.from+'..'+R.to;
  if(!force && MBBOOK.key===key && (MBBOOK.status==='ok'||MBBOOK.status==='loading')) return;
  MBBOOK.status='loading'; MBBOOK.error=null; MBBOOK.key=key;
  MBBOOK.suppliers=null; MBBOOK.categories=null;
  paint();
  try{
    const q = 'from='+R.from+'&to='+R.to;
    const [b,c] = await Promise.all([
      fetch('/api/reports/book?'+q+'&limit=1000',{credentials:'same-origin'}),
      fetch('/api/reports/breakdown?by=category&of=sales&'+q+'&limit=60',{credentials:'same-origin'})
    ]);
    if(b.status===401||c.status===401){ location.href='/login?next=%2Fportal'; return; }
    const bd = await b.json().catch(()=>({})), cd = await c.json().catch(()=>({}));
    if(MBBOOK.key!==key) return;
    if(!b.ok||!bd.ok){ MBBOOK.status='error'; MBBOOK.error=bd.detail||bd.message||('HTTP '+b.status); }
    else {
      MBBOOK.status='ok';
      MBBOOK.suppliers=bd.suppliers||[];
      MBBOOK.categories=(cd.ok?cd.rows:[])||[];
    }
  }catch(e){
    if(MBBOOK.key!==key) return;
    MBBOOK.status='error'; MBBOOK.error='No response from the server.';
  }
  paint();
}
window.loadBook=loadBook;

/* What is known about a supplier. The live views carry SupplierAlias but no

let liveSeq = 0;
async function loadLive(){
  const R = liveRange();
  const mine = ++liveSeq;                 // a later pick must win
  MBLIVE.status='loading'; MBLIVE.error=null; MBLIVE.range=R;
  MBLIVE.home=null;              // the pending period is not the loaded one
  paint();
  try{
    const res = await fetch('/api/reports/home?from='+R.from+'&to='+R.to,
                            {credentials:'same-origin'});
    if(res.status===401){ location.href='/login?next=%2Fportal'; return; }
    const data = await res.json().catch(()=>({}));
    if(mine!==liveSeq) return;
    if(!res.ok || !data.ok){
      MBLIVE.status='error';
      MBLIVE.error=(data.detail||data.message||('HTTP '+res.status));
      /* Drop the previous figures. Keeping them would leave the tiles showing
         one period's numbers under another period's label - which is worse
         than showing nothing, because it looks right. */
      MBLIVE.home=null; MBLIVE.at=null;
    } else {
      MBLIVE.status='ok'; MBLIVE.home=data.home; MBLIVE.at=new Date();
    }
  }catch(e){
    if(mine!==liveSeq) return;
    MBLIVE.status='error'; MBLIVE.error='No response from the server.';
    MBLIVE.home=null; MBLIVE.at=null;
  }
  paint();
}
window.loadLive=loadLive;

function deptRows(){
  // The daily series runs per supplier, so a design's share of the period is its
  // share of that supplier's season. Exact at supplier level, proportioned below.
  const scale={};
  SUPPLIERS.forEach(function(k){
    const rows=ART[k]||[]; const season=rows.reduce((a,r)=>a+r.s,0)||1;
    scale[k]=soldFor(k)/season;
  });
  let list=allRows().map(function(r){
    const q=Math.round(r.s*(scale[r.alias]||0));
    // sold and sales value move with the period; sell-through does not - it is a
    // season measure, and comparing one day's sales against the whole balance
    // would say the category is clearing at 3%
    return Object.assign({},r,{s:q, vs:q*r.r, sSeason:r.s});
  }).filter(r=>r.s>0||r.b>0);
  if(dept) list=list.filter(r=>groupOf(r.d)===dept);
  const key={sold:r=>r.s, left:r=>r.b, st:r=>r.st, worst:r=>-r.st,
             val:r=>r.b*r.r, sales:r=>r.s*r.r}[dsort]||(r=>r.s);
  list.sort((a,b)=>key(b)-key(a));
  return list;
}

  const arts=list.reduce((a,x)=>a+x.ar,0);
  const soldout=list.reduce((a,x)=>a+x.so,0);
  const nomove=list.reduce((a,x)=>a+x.nm,0);
  const st=(season+bal)?Math.round(season/(season+bal)*100):0;
  const worst=list.slice().filter(x=>x.b>=500).sort((a,b)=>a.st-b.st).slice(0,5);
  const best =list.slice().sort((a,b)=>b.s-a.s).slice(0,5);

function supplierList(){

    let owe=0, over=0, bills=0;
    if(a)(a.companies||[]).forEach(c=>{ owe+=c.outstanding||0; over+=c.overdue||0; bills+=c.openBills||0; });
    const o=det?((PO[x.a]||{}).rows||[]).reduce((y,r)=>y+Math.max(0,r.pending-((poState(x.a,r.po).disp||{}).qty||0)),0):0;
    return {alias:x.a, vendor:x.v, city:x.c, sold:(bookSold(x)!=null?bookSold(x):x.s),
            bal:x.b, st:x.st, owe:owe, over:over, bills:bills, onOrder:o, det:det,
            mgr:x.mg, dept:x.d, ledgers:x.lg, articles:x.ar,
            companies:(a&&a.companies)||[]};
  }).filter(function(x){
    if(supdept && groupOf(x.dept)!==supdept) return false;
    if(supmine && x.mgr!==ME.mgr) return false;
    if(!supq) return true;
    const q=supq.toLowerCase();
    return x.vendor.toLowerCase().indexOf(q)>=0 || x.alias.toLowerCase().indexOf(q)>=0
      || String(x.city).toLowerCase().indexOf(q)>=0
      || x.companies.some(c=>String(c.ledger).toLowerCase().indexOf(q)>=0);
  }).sort(function(a,b){
    if(supsort==='owe')  return b.owe-a.owe;
    if(supsort==='over') return b.over-a.over;
    if(supsort==='sold') return b.sold-a.sold;
    if(supsort==='left') return b.bal-a.bal;
    if(supsort==='st')   return a.st-b.st;
    if(supsort==='name') return a.vendor.localeCompare(b.vendor);
    return b.sold-a.sold;
  });
