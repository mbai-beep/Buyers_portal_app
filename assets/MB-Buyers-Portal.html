/* ==================================================== comparing against before
   Anu, 1 Sep 2026: comparative data against previous years, by phase, by period
   or by dates.

   The hard-won lesson is in the Darshan build. Its "vs last year" reading was a
   chain monthly constant spread by a weekday curve with festival multipliers,
   scoped to a showroom by that showroom's share of THIS year — and it read ~70%
   of last year on days the chain was in fact 12.4% ahead. What fixed it was
   refusing to guess where last year's sale fell. The same discipline here:

     - a MONTH is not like-for-like, because the sale moved. This year the
       half-yearly was split in two and the Rakhi sale ran to 31 August; last
       year it was one run of 46-52 days. August against August compares a
       Rakhi sale to a half-yearly.
     - a PHASE against the same PHASE is like-for-like, whatever dates it fell on.
     - and where there is no prior-year figure, the cell says so rather than
       printing one.                                                            */

const PHASES=[
  {k:'p1', lab:'New season',        from:'2026-04-01', to:'2026-07-09',
   note:'Summer stock against last year’s clearance. Mother’s Day and the June event sit inside it.'},
  {k:'p2a',lab:'Half yearly sale',  from:'2026-07-10', to:'2026-08-10',
   note:'30% off. Historically one run of 46–52 days; split in two this year.'},
  {k:'p2b',lab:'Rakhi sale',        from:'2026-08-11', to:'2026-08-31',
   note:'Smaller discounts, different product. New this year as a separate run.'},
  {k:'p3', lab:'2K 4K 8K event',    from:'2026-09-03', to:'2026-10-09',
   note:'Flat price points, three batches of nine days. Not yet traded.'},
  {k:'p4', lab:'Festive',           from:'2026-10-10', to:'2026-12-31',
   note:'First Navratra to end December. Where the buying happens and full price sells.'}
];
/* The dates above are INFERRED from where the cohort mix turns, not read from a
   calendar — the MIS consolidated file has the real ones and is not in the hub.
   Every screen that uses them says so. */
const PHASE_DATES_FIRM=false;

function phaseSold(ph, alias){
  const rec=DAILY[alias]; if(!rec) return null;
  const from = ph.from>rec.dayFrom?ph.from:rec.dayFrom;
  const to   = ph.to<FEED_TO?ph.to:FEED_TO;
  if(from>to) return null;                       // not traded yet in this data
  return {q:sumRange(alias,from,to), days:Math.round(
    (new Date(to+'T00:00:00Z')-new Date(from+'T00:00:00Z'))/86400000)+1, from:from, to:to};
}
function phaseTotals(){
  return PHASES.map(function(ph){
    let q=0, days=0, traded=false;
    SUPPLIERS.forEach(function(k){
      const r=phaseSold(ph,k); if(!r) return;
      traded=true; q+=r.q; days=Math.max(days,r.days);
    });
    return {ph:ph, q:q, days:days, traded:traded, rate:days?Math.round(q/days):0};
  });
}

let cmpMode='phase';
window.setCmp=function(k){ cmpMode=k; paint(); };
function compareBlock(){
  const list=phaseTotals().filter(x=>x.traded);
  const best=list.slice().sort((a,b)=>b.rate-a.rate)[0];
  return '<div class="colhd">Against before</div>'+
    '<div class="rsort">'+[['phase','Same phase'],['dates','Same dates'],['season','Same point in the season']]
      .map(x=>'<button aria-pressed="'+(cmpMode===x[0])+'" onclick="setCmp(\''+x[0]+'\')">'+
        x[1]+'</button>').join('')+'</div>'+

    (cmpMode==='phase'
      ? '<span class="rnote">A sale compared to a sale. The phase is matched on its own dates in '+
        'each year, not on the calendar — which is the only way this reads true, because the sale '+
        'moves. This year the half-yearly was split and the Rakhi sale added; last year it was one '+
        'run.</span>'
      : cmpMode==='dates'
      ? '<span class="rnote"><b>Read this one carefully.</b> The same dates in two years are often '+
        'two different phases. August 2026 is a Rakhi sale; August 2025 was the back half of a '+
        'single half-yearly. Use it for cash and staffing, not for judging a buy.</span>'
      : '<span class="rnote">Day N since the goods first landed. Useful where a supplier started '+
        'late — Neetas first supplied on 27 April this year, so their season is three weeks shorter '+
        'than a supplier who started on the 8th.</span>')+

    '<table class="at"><thead><tr><th>Phase</th><th class="n">Days</th><th class="n">Pieces</th>'+
      '<th class="n">A day</th><th class="n">Last year</th></tr></thead><tbody>'+
    list.map(function(x){
      return '<tr><td class="k">'+x.ph.lab+'<span>'+pretty(x.ph.from)+' – '+pretty(x.ph.to)+
          '</span></td>'+
        '<td class="n">'+n0(x.days)+'</td>'+
        '<td class="n">'+n0(x.q)+'</td>'+
        '<td class="n"'+(best&&best.ph.k===x.ph.k?' style="color:var(--mb-ok);font-weight:600"':'')+
          '>'+n0(x.rate)+'</td>'+
        '<td class="n" style="color:var(--mb-mute)">not held</td></tr>';
    }).join('')+'</tbody></table>'+

    (best?'<div class="story" style="margin-top:10px"><p>Of the phases traded so far, <b>'+
      best.ph.lab.toLowerCase()+'</b> moved fastest at <b>'+n0(best.rate)+' pieces a day</b>. '+
      best.ph.note+'</p>'+
      '<p>Pieces a day is only half the read. The Rakhi sale realises about <b>71.5%</b> of MRP '+
      'against the half-yearly’s <b>66.6%</b> — fewer pieces at a better price is a different '+
      'result from fewer pieces. Realisation is not in this build yet; it comes with the same '+
      'sales-value field the tile at the top is waiting on.</p></div>':'')+

    '<span class="rnote"><b>What the last column needs.</b> Two prior years sit in the ERP as '+
      'VW_MB_AI_DSB_REPORT_2425 (1.57 m rows) and _2526 (1.98 m rows) — granted to our login and '+
      'never extracted. Once they are in the hub every figure on this page gains its own '+
      'like-for-like. The retail side already learned this the hard way: Darshan’s first '+
      '“vs last year” was a chain constant spread by a weekday curve, and it read 70% of last '+
      'year on days the chain was 12.4% ahead. No figure goes in that column until it is read, '+
      'not modelled.</span>'+
    (PHASE_DATES_FIRM?'':'<span class="rnote">Phase dates above are inferred from where the '+
      'cohort mix turns. The MIS consolidated file carries the real boundaries and is not in the '+
      'hub — with it, every sale can be stamped to its phase exactly.</span>');
}


/* ============================================== how the range was bought
   Anu, 1 Sep 2026: think like a category buyer at M&S, Zara or Uniqlo.

   What those buyers actually read is not "sales up 12%". It is four things,
   and three of them are computable across all 225 suppliers today:

     OPTIONS   how many designs were bought into the category
     DEPTH     units per design — breadth-and-shallow against narrow-and-deep
     ROS       rate of sale: units per design per week on the floor
     CLEARANCE what has gone out completely, and what never moved at all

   A category up 20% on twice the options is not the same business as one up
   20% on the same options selling harder, and only the second is a buying
   result. This block says which it is.                                     */
const WEEKS_TRADED = 21.4;                     // 1 April to 30 August

function buyShape(list){
  const options=list.reduce((a,x)=>a+x.ar,0);
  const skus=list.reduce((a,x)=>a+x.sk,0);
  const bought=list.reduce((a,x)=>a+x.su,0);
  const sold=list.reduce((a,x)=>a+x.s,0);
  const bal=list.reduce((a,x)=>a+x.b,0);
  const gone=list.reduce((a,x)=>a+x.so,0);
  const dead=list.reduce((a,x)=>a+x.nm,0);
  return {n:list.length, options, skus, bought, sold, bal, gone, dead,
    depth: options?Math.round(bought/options):0,
    coloursPer: options?(skus/options):0,
    ros: options?(sold/options/WEEKS_TRADED):0,
    st: (sold+bal)?Math.round(sold/(sold+bal)*100):0,
    gonePct: skus?Math.round(gone/skus*100):0,
    deadPct: skus?Math.round(dead/skus*100):0};
}
function buyBlock(){
  const here=BOOK.filter(x=>!dept || groupOf(x.d)===dept);
  const b=buyShape(here), all=buyShape(BOOK);
  const g=GROUPS.find(x=>x.k===dept);
  const name=g?g.lab.toLowerCase():'the book';
  const vs=function(a,c,unit,dp){
    const d=c?((a-c)/c*100):0;
    const s=(d>=0?'+':'')+d.toFixed(0)+'%';
    return '<u class="'+(Math.abs(d)<8?'':(d>0?'up':'dn'))+'">'+s+' against the book</u>';
  };
  /* the deepest and the widest buys inside this category */
  const rank=here.filter(x=>x.ar>=10).map(function(x){
    return {v:x.v, a:x.a, opts:x.ar, depth:Math.round(x.su/x.ar),
            ros:x.s/x.ar/WEEKS_TRADED, st:x.st, gone:x.so, dead:x.nm, bal:x.b};
  });
  const hardest=rank.slice().sort((p,q)=>q.ros-p.ros).slice(0,3);
  const widest =rank.slice().sort((p,q)=>q.opts-p.opts).slice(0,3);
  const softest=rank.filter(x=>x.bal>=500).sort((p,q)=>p.ros-q.ros).slice(0,3);

  return '<div class="colhd">How the range was bought</div>'+
    '<div class="buyg">'+
      '<div><span>Options</span><b>'+n0(b.options)+'</b><u>designs bought in</u></div>'+
      '<div><span>Depth</span><b>'+n0(b.depth)+'</b>'+vs(b.depth,all.depth)+'</div>'+
      '<div><span>Rate of sale</span><b>'+b.ros.toFixed(1)+'</b>'+vs(b.ros,all.ros)+'</div>'+
      '<div><span>Sell-through</span><b>'+b.st+'%</b>'+vs(b.st,all.st)+'</div>'+
    '</div>'+
    '<span class="rnote">Depth is units bought per design; rate of sale is units per design per '+
      'week across '+WEEKS_TRADED.toFixed(0)+' weeks of trading. A category is bought either wide '+
      'and shallow or narrow and deep, and the two fail differently — wide and shallow leaves you '+
      'with nothing to repeat, narrow and deep leaves you with terminal stock.</span>'+
    '<div class="story">'+
      '<p>'+(g?g.lab:'The book')+' was bought <b>'+
        (b.depth>all.depth*1.15?'deeper':(b.depth<all.depth*0.85?'shallower':'about as deep'))+
        '</b> than the book as a whole — '+n0(b.depth)+' pieces a design against '+n0(all.depth)+
        ' — across <b>'+n0(b.options)+' options</b> from '+n0(b.n)+' suppliers, at '+
        b.coloursPer.toFixed(1)+' colours a design.</p>'+
      '<p>Of '+n0(b.skus)+' colours across those options, <b>'+n0(b.gone)+' ('+b.gonePct+
        '%) have sold out completely</b> and <b>'+n0(b.dead)+' ('+b.deadPct+
        '%) have never sold a piece</b>. Both are buying errors and they point opposite ways: the '+
        'first is money we did not take because nobody was told to repeat, the second is money '+
        'sitting on a floor.</p>'+
      (hardest.length?'<p>Selling hardest per option: <b>'+hardest.map(x=>T(x.v)).join('</b>, <b>')+
        '</b> — '+T(hardest[0].v)+' at '+hardest[0].ros.toFixed(1)+
        ' a design a week on '+n0(hardest[0].opts)+' options. That is where more options belong.</p>':'')+
      (softest.length?'<p>Selling slowest on a real holding: <b>'+T(softest[0].v)+'</b> at '+
        softest[0].ros.toFixed(1)+' a week across '+n0(softest[0].opts)+' options, '+
        n0(softest[0].bal)+' pieces still here. Fewer options, or none.</p>':'')+
    '</div>'+
    '<div class="colhd">Options against rate of sale</div>'+
    '<table class="at"><thead><tr><th>Supplier</th><th class="n">Options</th>'+
      '<th class="n">Depth</th><th class="n">A week</th><th class="n">Through</th></tr></thead><tbody>'+
    rank.slice().sort((p,q)=>q.opts-p.opts).slice(0,12).map(function(x){
      return '<tr onclick="openSup(\''+x.a+'\')"><td class="k">'+T(x.v)+'<span>'+x.a+
          ' · '+n0(x.gone)+' colours sold out · '+n0(x.dead)+' never moved</span></td>'+
        '<td class="n">'+n0(x.opts)+'</td><td class="n">'+n0(x.depth)+'</td>'+
        '<td class="n">'+x.ros.toFixed(1)+'</td>'+
        '<td class="n" style="color:var(--mb-'+band(x.st)+');font-weight:600">'+x.st+'%</td></tr>';
    }).join('')+'</tbody></table>'+
    '<span class="rnote">Twelve biggest by options, of '+n0(rank.length)+' suppliers with ten or '+
      'more. This is the table a category buyer at a Zara or an M&amp;S lives on: it says who to '+
      'give more options to and who to take them from, which is the only decision a buyer '+
      'actually makes.</span>';
}

/* ==================================================== WHAT THE EYE WOULD MISS
   Anu, 1 Sep 2026: "we have a lot of data. However, with the naked eye, it is
   very difficult to analyse and see the hidden stories of that data."

   Nobody reads 225 rows and spots that a supplier collapsing week-on-week is
   not losing demand but running out of stock. These are computed across the
   whole book every time the screen opens — four crossings that only show up
   when two figures are read against each other, never one at a time.

   Each one is a claim with its arithmetic attached, so it can be argued with.  */
const SEASON_WK = 21.4;

function signals(){
  const out=[];
  const rate = x => (x.s||0)/SEASON_WK;                 // pieces a week this season
  const cover = x => rate(x)? x.b/rate(x) : 999;        // weeks of stock left
  const run7 = x => Math.round(x.s7*30/7);              // last week, at a 30-day pace
  const mom  = x => x.s30 ? (run7(x)/x.s30-1)*100 : 0;

  /* 1. Reading like a failure, actually running dry.
        A steep weekly fall AND a high sell-through AND thin cover is not a
        supplier going off — it is a supplier we have emptied. */
  BOOK.filter(x=>x.s30>=200 && mom(x)<=-40 && x.st>=80 && cover(x)<=6)
    .sort((a,b)=>cover(a)-cover(b)).slice(0,3).forEach(function(x){
      out.push({k:'dry', alias:x.a, v:x.v,
        head:T(x.v)+' is not slowing down — it is running out',
        body:'Last week ran at '+n0(run7(x))+' a month against '+n0(x.s30)+
          ' the month before, a fall of '+Math.abs(Math.round(mom(x)))+'%. But they are '+
          x.st+'% sold through with '+n0(x.b)+' pieces left — <b>'+cover(x).toFixed(1)+
          ' weeks of cover</b>. The fall is empty shelves, not lost demand.',
        act:'Raise an order', fn:"startPO('"+x.a+"');go('newpo')", sev:'act'});
    });

  /* 2. Sold hard, bought thin. High sell-through and a high share of colours
        gone, on very shallow depth: they can sell and we did not back them. */
  BOOK.filter(x=>x.sk>=20 && x.s>=800 && x.st>=85 && (x.so/x.sk)>=0.4)
    .map(x=>Object.assign({},x,{depth:Math.round(x.su/x.ar), cov:cover(x)}))
    .sort((a,b)=>a.cov-b.cov).slice(0,3).forEach(function(x){
      out.push({k:'thin', alias:x.a, v:x.v,
        head:T(x.v)+' sold almost everything we gave them',
        body:n0(x.s)+' pieces at <b>'+x.st+'% through</b>, and '+
          Math.round(x.so/x.sk*100)+'% of their colours have gone out completely — on '+
          n0(x.ar)+' designs at just '+n0(x.depth)+' pieces a design. '+
          (x.cov<3?'<b>'+x.cov.toFixed(1)+' weeks of cover left.</b>':'')+
          ' We bought them wide and shallow and every option cleared.',
        act:'Order more, deeper', fn:"startPO('"+x.a+"');go('newpo')", sev:'act'});
    });

  /* 3. Six months of stock. Cover measured against their own selling rate,
        which is the only way it means anything. */
  BOOK.filter(x=>x.b>=2000 && cover(x)>=20)
    .sort((a,b)=>b.b-a.b).slice(0,3).forEach(function(x){
      out.push({k:'stuck', alias:x.a, v:x.v,
        head:n0(x.b)+' pieces of '+T(x.v)+' is <b>'+Math.round(cover(x))+' weeks of stock</b>',
        body:'They sell about '+n0(Math.round(rate(x)))+' a week and we are holding '+n0(x.b)+
          ' — at that pace this clears in '+Math.round(cover(x)/4.3)+
          ' months, well past the season. '+x.st+'% through so far.',
        act:'Open the supplier', fn:"openSup('"+x.a+"')", sev:'risk'});
    });

  /* 4. Money spread across options that are not turning. */
  BOOK.filter(x=>x.ar>=100 && (x.s/x.ar/SEASON_WK)<0.35 && x.b>=500)
    .sort((a,b)=>(a.s/a.ar)-(b.s/b.ar)).slice(0,2).forEach(function(x){
      const ros=x.s/x.ar/SEASON_WK;
      out.push({k:'thinly', alias:x.a, v:x.v,
        head:T(x.v)+' has '+n0(x.ar)+' designs and none of them turn',
        body:'Each design sells <b>'+ros.toFixed(1)+' pieces a week</b> against a book average '+
          'nearer 1.5. '+n0(x.b)+' pieces still here at '+x.st+
          '% through. Fewer designs, more of each — or a different supplier.',
        act:'Open the supplier', fn:"openSup('"+x.a+"')", sev:'dead'});
    });

  return out;
}

/* ========================================================= THE STATISTICS
   Anu, 1 Sep 2026: read the data the way a statistician would, and hand a buyer
   the finding, not the method.

   Four things are done here that a percentage on a dashboard does not do, and
   each one changes which supplier you would act on:

   1  SHRUNK SELL-THROUGH. A supplier who sold 9 of 11 pieces is not "82%
      through" — that is a coin landing heads three times. Every supplier's rate
      is pulled toward the book's own rate in proportion to how little evidence
      supports it (a Beta prior, its strength fitted from the book by moment
      matching, k = 20 on 655,887 pieces bought). Big suppliers barely move;
      small ones move a lot, which is right.

   2  RELATIVE MOMENTUM. This one overturned my own earlier reading. The whole
      chain's last seven days are running 29% BELOW its own thirty-day pace —
      the Rakhi sale is winding down before the 3 September event. So a supplier
      at −29% is exactly average, not collapsing. Every momentum figure here is
      measured against the book's, never against zero.

   3  ROBUST OUTLIERS. Retail data is long-tailed, so mean and standard
      deviation are the wrong tools — one Noya drags the mean and nothing else
      ever looks unusual. Median and MAD on log rate-of-sale instead.

   4  IS IT REAL. Before any comparison is shown, a two-proportion test against
      the book decides whether the gap is a finding or a run of luck. The buyer
      never sees a z-score; they see "this is real" or they do not see the card. */

const STATS = (function(){
  const WK=21.4;
  const totN=BOOK.reduce((a,x)=>a+(x.su||0),0);
  const totK=BOOK.reduce((a,x)=>a+(x.s||0),0);
  const m=totK/totN;                                   // the book's own sell-through
  /* Beta prior strength by moment matching on suppliers with real samples */
  let sw=0, ss=0, cnt=0;
  BOOK.forEach(function(x){ if(x.su>=50){ const p=x.s/x.su; sw+=x.su; ss+=x.su*Math.pow(p-m,2); cnt++; } });
  const varP=ss/sw, nbar=sw/cnt;
  let k=m*(1-m)/Math.max(varP-m*(1-m)/nbar,1e-6)-1;
  k=Math.max(20,Math.min(k,5000));
  /* robust centre and spread of rate-of-sale, on logs */
  const lg=BOOK.filter(x=>x.ar>0 && x.s>0).map(x=>Math.log(x.s/x.ar/WK)).sort((a,b)=>a-b);
  const med=lg[Math.floor(lg.length/2)];
  const mad=lg.map(x=>Math.abs(x-med)).sort((a,b)=>a-b)[Math.floor(lg.length/2)]||0.5;
  /* the book's own momentum, which every supplier is judged against */
  const b7=BOOK.reduce((a,x)=>a+x.s7,0), b30=BOOK.reduce((a,x)=>a+x.s30,0);
  const bookMom=b30?(b7*30/7)/b30:1;
  /* how much of the book rides on how few */
  const bySold=BOOK.slice().sort((a,b)=>b.s-a.s);
  const top10=bySold.slice(0,10).reduce((a,x)=>a+x.s,0)/totK;
  const top25=bySold.slice(0,25).reduce((a,x)=>a+x.s,0)/totK;
  return {WK, m, k, med, mad, bookMom, totN, totK, top10, top25, n:BOOK.length};
})();

function stat(x){
  const S=STATS, n=x.su||0;
  const raw = n? x.s/n : 0;
  const shrunk = (x.s + S.m*S.k)/(n + S.k);            // 1. evidence-weighted
  const rate = x.ar? x.s/x.ar/S.WK : 0;                // pieces a design a week
  const weekly = x.s/S.WK;                             // pieces a week, all designs
  const cover = weekly? x.b/weekly : 999;              // weeks of stock left
  const run7 = Math.round(x.s7*30/7);
  const mom  = x.s30? (run7/x.s30) : 1;
  const relMom = S.bookMom? (mom/S.bookMom-1)*100 : 0; // 2. against the chain
  const z = rate>0 ? 0.6745*(Math.log(rate)-S.med)/S.mad : -9;   // 3. robust
  /* 4. is the gap to the book real? two-proportion test */
  const se = Math.sqrt(S.m*(1-S.m)/Math.max(n,1));
  const zp = se? (raw-S.m)/se : 0;
  return {raw, shrunk, rate, weekly, cover, run7, mom, relMom, z, zp,
          real: Math.abs(zp)>=2, n:n,
          stockout: cover<52 ? addDays(TODAY_ISO, Math.round(cover*7)) : null};
}

/* the four corners a supplier can sit in */
function quadrant(s){
  const fast = s.z >= 0;                 // turning faster than the median design
  const thin = s.cover <= 8;             // under two months of stock
  if(fast && thin)  return 'reorder';    // selling well and about to run out
  if(fast && !thin) return 'healthy';
  if(!fast && thin) return 'quiet';      // slow, but not much money in it
  return 'stuck';                        // slow and holding
}
const QUAD={
  reorder:{lab:'Reorder now', note:'turning fast, weeks from empty'},
  healthy:{lab:'Healthy',     note:'turning fast, well stocked'},
  quiet:  {lab:'Quiet',       note:'slow, but little money in it'},
  stuck:  {lab:'Overbought',  note:'slow and holding stock'}
};


/* ================================================= THE BOOK ON ONE PICTURE
   225 suppliers as 225 dots. Across: how many weeks of stock is left at their
   own selling pace. Up: how fast each design turns. Size: how many pieces are
   sitting there. A table of 225 rows hides all of this; the eye finds the four
   corners in a second.                                                        */
function quadChart(){
  const pts=BOOK.filter(x=>x.ar>0 && x.su>0).map(function(x){
    const s=stat(x);
    return {x:x, s:s, q:quadrant(s),
            cov:Math.min(Math.max(s.cover,0.4),60), ros:Math.max(s.rate,0.04)};
  });
  const W=330, H=250, P={l:34,r:12,t:12,b:30};
  const lx=v=>Math.log(v), ly=v=>Math.log(v);
  const x0=lx(0.4), x1=lx(60), y0=ly(0.04), y1=ly(12);
  const px=v=>P.l+(lx(v)-x0)/(x1-x0)*(W-P.l-P.r);
  const py=v=>H-P.b-(ly(v)-y0)/(y1-y0)*(H-P.t-P.b);
  const rr=b=>Math.max(2.2,Math.min(11,Math.sqrt(b/40)));
  const xt=[1,4,13,26,52], yt=[0.1,0.5,2,8];
  const midx=px(8), midy=py(Math.exp(STATS.med));
  return '<figure class="qchart">'+
    '<figcaption>Every supplier, by how fast it turns and how long its stock lasts</figcaption>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Rate of sale against weeks of cover, 225 suppliers">'+
      /* quadrant grounds */
      '<rect class="qz reorder" x="'+P.l+'" y="'+P.t+'" width="'+(midx-P.l)+'" height="'+(midy-P.t)+'"/>'+
      '<rect class="qz stuck" x="'+midx+'" y="'+midy+'" width="'+(W-P.r-midx)+'" height="'+(H-P.b-midy)+'"/>'+
      /* grid */
      xt.map(v=>'<line class="gl" x1="'+px(v)+'" y1="'+P.t+'" x2="'+px(v)+'" y2="'+(H-P.b)+'"/>').join('')+
      yt.map(v=>'<line class="gl" x1="'+P.l+'" y1="'+py(v)+'" x2="'+(W-P.r)+'" y2="'+py(v)+'"/>').join('')+
      '<line class="ax" x1="'+P.l+'" y1="'+(H-P.b)+'" x2="'+(W-P.r)+'" y2="'+(H-P.b)+'"/>'+
      '<line class="ax" x1="'+P.l+'" y1="'+P.t+'" x2="'+P.l+'" y2="'+(H-P.b)+'"/>'+
      /* the dots, biggest first so small ones stay clickable on top */
      pts.sort((a,b)=>b.x.b-a.x.b).map(function(p){
        return '<circle class="dot '+p.q+'" cx="'+px(p.cov).toFixed(1)+'" cy="'+py(p.ros).toFixed(1)+
          '" r="'+rr(p.x.b).toFixed(1)+'"><title>'+T(p.x.v)+' · '+p.x.a+'\n'+
          p.s.rate.toFixed(1)+' a design a week · '+wks(p.s.cover)+' of cover\n'+
          n0(p.x.b)+' pieces left · '+Math.round(p.s.shrunk*100)+'% through</title></circle>';
      }).join('')+
      /* ticks */
      xt.map(v=>'<text class="tk" x="'+px(v)+'" y="'+(H-P.b+13)+'" text-anchor="middle">'+
        (v===52?'1 yr':v+'w')+'</text>').join('')+
      yt.map(v=>'<text class="tk" x="'+(P.l-5)+'" y="'+(py(v)+3.5)+'" text-anchor="end">'+v+'</text>').join('')+
      '<text class="axl" x="'+((W+P.l)/2)+'" y="'+(H-3)+'" text-anchor="middle">weeks of stock left</text>'+
      '<text class="axl" x="9" y="'+((H)/2)+'" text-anchor="middle" transform="rotate(-90 9 '+(H/2)+')">pieces a design a week</text>'+
      '<text class="qlab" x="'+(P.l+6)+'" y="'+(P.t+13)+'">Reorder now</text>'+
      '<text class="qlab dim" x="'+(W-P.r-6)+'" y="'+(H-P.b-6)+'" text-anchor="end">Overbought</text>'+
    '</svg>'+
    '<div class="qleg">'+['reorder','healthy','quiet','stuck'].map(function(k){
      const n=pts.filter(p=>p.q===k).length;
      return '<span class="'+k+'"><i></i>'+QUAD[k].lab+' <b>'+n0(n)+'</b></span>';
    }).join('')+'</div>'+
    '<p class="qcap">Dot size is pieces still with us. Both scales are logarithmic — the book '+
      'spans a supplier selling 0.04 a design a week and one selling 12, and a straight scale '+
      'would flatten all but the top few into the axis.</p>'+
  '</figure>';
}

/* ---------------------------------------------------- the statistical watch */
function watchBoard(){
  const S=STATS;
  const rows=BOOK.map(x=>({x:x, s:stat(x), q:null}));
  rows.forEach(r=>r.q=quadrant(r.s));

  /* Reorder now — fast and nearly empty, and the difference from the book is real */
  const reorder=rows.filter(r=>r.q==='reorder' && r.s.n>=200 && r.s.real && r.s.shrunk>S.m)
    .sort((a,b)=>a.s.cover-b.s.cover).slice(0,4);
  /* Beating the chain, once the chain's own slowdown is removed */
  const rising=rows.filter(r=>r.x.s30>=150 && r.s.relMom>=25)
    .sort((a,b)=>b.s.relMom-a.s.relMom).slice(0,3);
  /* Money that will not clear inside the year */
  const stuck=rows.filter(r=>r.x.b>=1500 && r.s.cover>=26)
    .sort((a,b)=>b.x.b-a.x.b).slice(0,3);
  /* Where the raw percentage lies because the sample is tiny */
  const mirage=rows.filter(r=>r.s.n>0 && r.s.n<300 && Math.abs(r.s.raw-r.s.shrunk)>=0.08)
    .sort((a,b)=>Math.abs(b.s.raw-b.s.shrunk)-Math.abs(a.s.raw-a.s.shrunk)).slice(0,3);

  const card=(r,head,body,act,fn,sev)=>{
    const pic=bestPicFor(r.x.a);
    return '<article class="qc find '+sev+'">'+
      '<div class="qcrow">'+
        (pic?'<span class="qcpic"><img src="'+pic+'" alt="" loading="lazy"></span>'
            :'<span class="qcpic np" style="background:'+sw(r.x.v)+'">'+initials(r.x.v)+'</span>')+
        '<div class="qcb"><h4>'+head+'</h4><p>'+body+'</p></div></div>'+
      '<div class="qcf"><span>'+r.x.a+' · '+T(r.x.c)+' · '+(r.x.mg||'unassigned')+'</span>'+
        '<button onclick="'+fn+'">'+act+'</button></div></article>';
  };
  const block=(title,note,list,fn)=> list.length
    ? '<section class="qsec find"><h3><span class="qdot"></span>'+title+
      '<em>'+n0(list.length)+'</em></h3><p class="qnote">'+note+'</p>'+
      list.map(fn).join('')+'</section>' : '';

  return '<div class="tabhd"><h2>The watch</h2><p>Read across all '+n0(S.n)+
      ' suppliers every time this opens. Nothing here is a threshold on one number — '+
      'each finding needs two figures crossed, and the difference tested against the book '+
      'before it is shown.</p></div>'+

    quadChart()+

    '<div class="statbar">'+
      '<div><span>Book sell-through</span><b>'+(S.m*100).toFixed(0)+'%</b>'+
        '<u>the line every supplier is judged against</u></div>'+
      '<div><span>Chain this week</span><b class="'+(S.bookMom<1?'dn':'up')+'">'+
        ((S.bookMom-1)*100).toFixed(0)+'%</b><u>against its own thirty-day pace</u></div>'+
      '<div><span>Top ten suppliers</span><b>'+(S.top10*100).toFixed(0)+'%</b>'+
        '<u>of everything sold</u></div>'+
    '</div>'+
    '<p class="qfoot"><b>The chain itself is running '+Math.abs(Math.round((S.bookMom-1)*100))+
      '% below its own month.</b> The Rakhi sale is winding down before the 3 September event, so '+
      'a supplier at −'+Math.abs(Math.round((S.bookMom-1)*100))+'% this week is exactly average. '+
      'Every momentum figure below is measured against the chain, not against zero — without that '+
      'correction almost every supplier in the book reads as failing.</p>'+

    block('Reorder now','Turning faster than the median design and weeks from empty, '+
      'on enough pieces for the gap to the book to be real rather than luck.', reorder, r=>
      card(r, T(r.x.v)+' runs out in '+wks(r.s.cover),
        n0(r.x.s)+' sold at <b>'+Math.round(r.s.shrunk*100)+'% through</b> — each design turning '+
        r.s.rate.toFixed(1)+' a week against a book median of '+Math.exp(STATS.med).toFixed(1)+
        '. Only '+n0(r.x.b)+' pieces left'+
        (r.s.stockout?', empty around <b>'+pretty(r.s.stockout)+'</b>':'')+'.',
        'Raise an order',"startPO('"+r.x.a+"');go('newpo')",'act'))+

    block('Beating the chain','Momentum after the chain’s own slowdown is taken out. '+
      'These are genuinely accelerating, not merely falling more slowly.', rising, r=>
      card(r, T(r.x.v)+' is <b>'+Math.round(r.s.relMom)+'% ahead</b> of the chain this week',
        'Last week ran at '+n0(r.s.run7)+' a month against '+n0(r.x.s30)+
        ' the month before. The chain fell '+Math.abs(Math.round((S.bookMom-1)*100))+
        '% over the same days; they did not. '+Math.round(r.s.shrunk*100)+'% through, '+
        n0(r.x.b)+' left.',
        'Open the supplier',"openSup('"+r.x.a+"')",'act'))+

    block('Will not clear this year','Weeks of cover measured against each supplier’s own '+
      'selling rate, which is the only way the figure means anything.', stuck, r=>
      card(r, n0(r.x.b)+' pieces of '+T(r.x.v)+' is '+Math.round(r.s.cover/4.3)+' months of stock',
        'They sell about '+n0(Math.round(r.s.weekly))+' a week. At that pace this clears around <b>'+
        (r.s.stockout?pretty(r.s.stockout):'well past the year')+'</b>. '+
        Math.round(r.s.shrunk*100)+'% through so far, against the book’s '+
        (S.m*100).toFixed(0)+'%.',
        'Open the supplier',"openSup('"+r.x.a+"')",'risk'))+

    block('The percentage is lying','A rate built on a handful of pieces is not a rate. '+
      'These are pulled toward the book in proportion to how little evidence stands behind them.',
      mirage, r=>
      card(r, T(r.x.v)+' reads '+Math.round(r.s.raw*100)+'%, and is really about '+
        Math.round(r.s.shrunk*100)+'%',
        'Only '+n0(r.s.n)+' pieces were ever bought from them, so the raw figure is close to a '+
        'coin toss. Weighted against the book’s '+(S.m*100).toFixed(0)+'% it comes out at '+
        Math.round(r.s.shrunk*100)+'%. '+
        (r.s.raw>r.s.shrunk?'Do not repeat on the strength of it yet.'
                           :'Worth a second look before dropping them.'),
        'Open the supplier',"openSup('"+r.x.a+"')",'dead'))+

    '<p class="qfoot">Method: sell-through is shrunk toward the book with a Beta prior fitted by '+
      'moment matching (k = '+Math.round(S.k)+' on '+n0(S.totN)+' pieces bought). Outliers use '+
      'median and MAD on log rate-of-sale, because one Noya would drag a mean and nothing else '+
      'would ever look unusual. A supplier is only shown against the book when a two-proportion '+
      'test says the gap is real.</p>';
}


/* ================================================================ THE PLAN
   Anu, 1 Sep 2026: a travel planner for each buyer, and a calendar for their
   other work — store visits, vendor meetings, internal meetings, sample reviews.

   The useful idea is not a calendar. It is that a trip is a cluster of decisions
   that happen to share a city. So when a buyer opens Surat, they get every
   supplier in Surat that has a reason to be seen this week — running out,
   overbought, late, or waiting on an answer — ranked, with the reason attached.
   A day out becomes a route rather than a diary entry.                        */

const MEET_KINDS={
  trip:   {lab:'Buying trip',    ic:'✈'},
  store:  {lab:'Store visit',    ic:'▦'},
  vendor: {lab:'Vendor meeting', ic:'◈'},
  team:   {lab:'Internal',       ic:'●'},
  sample: {lab:'Sample review',  ic:'✂'},
  event:  {lab:'Trading event',  ic:'⚑'}
};
/* The buyer's own week. The Monday four o'clock is Anu's standing meeting with
   Buying and Merchandising; the 3 September date is phase 3 opening. */
const DIARY=[
  {d:'2026-08-31', t:'16:00', k:'team',   what:'Buying & Merchandising, with Anu',
   where:'Head office', note:'Standing, every Monday.'},
  {d:'2026-09-01', t:'11:00', k:'sample', what:'Sample review — September event',
   where:'Head office', note:'66,888 pieces tagged SEPEVENT; 41,006 still at head office.'},
  {d:'2026-09-03', t:'—',     k:'event',  what:'“Everything 2K 4K 8K” opens — batch 1',
   where:'Batch 1 stores', note:'Nine days. Batch 2 from the 10th, batch 3 from the 17th.'},
  {d:'2026-09-05', t:'10:30', k:'store',  what:'Store visit — Delhi cluster',
   where:'05-DT, 43-DD2, 46-DD3', note:'Check the event floor set before batch 2.'},
  {d:'2026-09-09', t:'—',     k:'trip',   what:'Jaipur — buying trip', where:'Jaipur',
   note:'Noya and the assorted-lot suppliers.'},
  {d:'2026-09-12', t:'—',     k:'trip',   what:'Surat — buying trip', where:'Surat',
   note:'Krishriyaa on the 4XL question, and the reorders.'},
  {d:'2026-09-14', t:'16:00', k:'team',   what:'Buying & Merchandising, with Anu',
   where:'Head office', note:'Standing, every Monday.'},
  {d:'2026-09-18', t:'15:00', k:'vendor', what:'Rate revision — Neeraj’s list',
   where:'Head office', note:'Vendor relations, not design selection.'}
];

function dayName(iso){
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
    [new Date(iso+'T00:00:00Z').getUTCDay()];
}
/* every supplier in a city, with the reason they are worth an hour */
function cityCall(city){
  const key=String(city).toLowerCase();
  return BOOK.filter(x=>String(x.c).toLowerCase()===key).map(function(x){
    const s=stat(x), q=quadrant(s);
    const late=hasDetail(x.a)?((PO[x.a]||{}).rows||[]).filter(r=>r.due<TODAY_ISO &&
      Math.max(0,r.pending-((poState(x.a,r.po).disp||{}).qty||0))>0).length:0;
    const waiting=INBOX.filter(i=>i.alias===x.a && i.state==='open').length;
    let why=null, rank=0;
    if(q==='reorder' && s.n>=200){ why='Runs out in '+Math.round(s.cover)+
      ' weeks — '+Math.round(s.shrunk*100)+'% through'; rank=100-s.cover; }
    else if(late){ why=late+' order'+(late>1?'s':'')+' past due'; rank=90; }
    else if(waiting){ why=waiting+' thing'+(waiting>1?'s':'')+' waiting on your answer'; rank=80; }
    else if(q==='stuck' && x.b>=1000){ why=n0(x.b)+' pieces sitting, '+
      Math.round(s.cover/4.3)+' months of cover'; rank=70; }
    else if(s.relMom>=25){ why=Math.round(s.relMom)+'% ahead of the chain this week'; rank=60; }
    else { why=n0(x.s)+' sold, '+Math.round(s.shrunk*100)+'% through'; rank=10; }
    return {x:x, s:s, q:q, why:why, rank:rank};
  }).sort((a,b)=>b.rank-a.rank);
}
function cities(){
  const c={}; BOOK.forEach(x=>{ c[x.c]=(c[x.c]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>({city:k,n:c[k]}));
}

let planCity='';
window.setPlanCity=function(v){ planCity=v; paint(); };

function planTab(){
  const upcoming=DIARY.filter(d=>d.d>=TODAY_ISO).sort((a,b)=>a.d<b.d?-1:1);
  const cl=cities();
  return '<div class="tabhd"><h2>The plan</h2><p>Your week, and every trip built from the '+
    'suppliers who actually need seeing rather than the ones you happened to book.</p></div>'+
    sampleNotice('The diary and the trip plans are a worked example. A market visit is '+
      'something a person enters, so it needs its own screen to add one')+

    '<div class="colhd">Next in your diary</div>'+
    '<ol class="diary">'+upcoming.slice(0,6).map(function(d){
      const k=MEET_KINDS[d.k], away=Math.round((new Date(d.d+'T00:00:00Z')-
        new Date(TODAY_ISO+'T00:00:00Z'))/86400000);
      return '<li class="drow '+d.k+'">'+
        '<span class="dwhen"><b>'+(+d.d.slice(8,10))+' '+MN[+d.d.slice(5,7)-1]+'</b>'+
          '<u>'+dayName(d.d).slice(0,3)+(d.t!=='—'?' · '+d.t:'')+'</u></span>'+
        '<span class="dwhat"><b>'+d.what+'</b>'+
          '<span class="dk"><i>'+k.ic+'</i>'+k.lab+' · '+d.where+'</span>'+
          '<span class="dn">'+d.note+'</span></span>'+
        '<span class="daway">'+(away===0?'today':(away===1?'tomorrow':'in '+away+'d'))+'</span>'+
        (d.k==='trip'?'<button class="dbtn" onclick="setPlanCity(\''+d.where+'\')">Build it</button>':'')+
      '</li>';
    }).join('')+'</ol>'+

    '<div class="colhd">Plan a trip</div>'+
    '<div class="srch"><select onchange="setPlanCity(this.value)">'+
      '<option value=""'+(planCity?'':' selected')+'>Pick a city</option>'+
      cl.map(c=>'<option value="'+c.city+'"'+(planCity===c.city?' selected':'')+'>'+
        T(c.city)+' — '+c.n+' supplier'+(c.n>1?'s':'')+'</option>').join('')+
      '</select></div>'+
    (planCity? tripPlan(planCity)
      : '<p class="qfoot">Pick a city and the app lists every supplier there with a reason to be '+
        'seen — running out, overbought, late, or waiting on you — ranked by the reason, not '+
        'alphabetically. '+n0(BOOK.length)+' suppliers across '+cl.length+' cities.</p>')+

    '<div class="colhd">Also here</div>'+
    '<div class="rowlist">'+
      rowItem('trips','Buying trips', nextTripLine()||'nothing booked','','')+
      rowItem('msgs','Your team', TEAMMSG.filter(function(m){return m.state==='open';}).length+
        ' waiting','','')+
    '</div>';
}

function tripPlan(city){
  const list=cityCall(city);
  if(!list.length) return '<p class="qfoot">No supplier on your book is in '+T(city)+'.</p>';
  const worth=list.filter(r=>r.rank>=60);
  const pieces=list.reduce((a,r)=>a+r.x.b,0);
  return '<div class="tripsum"><div><b>'+n0(list.length)+'</b><span>suppliers in '+T(city)+
      '</span></div><div><b>'+n0(worth.length)+'</b><span>worth the visit</span></div>'+
      '<div><b>'+n0(pieces)+'</b><span>pieces with them</span></div></div>'+
    '<p class="qfoot">Ranked by why, not by name. A day here should start at the top of this list.</p>'+
    list.slice(0,14).map(function(r){
      const pic=bestPicFor(r.x.a);
      return '<article class="qc find '+(r.rank>=90?'risk':(r.rank>=60?'act':'dead'))+'">'+
        '<div class="qcrow">'+
          (pic?'<span class="qcpic"><img src="'+pic+'" alt="" loading="lazy"></span>'
              :'<span class="qcpic np" style="background:'+sw(r.x.v)+'">'+initials(r.x.v)+'</span>')+
          '<div class="qcb"><h4>'+T(r.x.v)+'</h4><p>'+r.why+'. '+n0(r.x.ar)+' designs, '+
            n0(r.x.b)+' pieces with us.</p></div></div>'+
        '<div class="qcf"><span>'+r.x.a+' · '+(r.x.mg||'unassigned')+' · '+QUAD[r.q].lab+'</span>'+
          '<button onclick="openSup(\''+r.x.a+'\')">Open</button></div></article>';
    }).join('')+
    (list.length>14?'<p class="qfoot">The fourteen with the strongest reason, of '+
      n0(list.length)+' in '+T(city)+'.</p>':'');
}
